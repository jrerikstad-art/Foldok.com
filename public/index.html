<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Foldok</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root { --ink:#16181D; --paper:#F2F0EA; --sheet:#fff; --line:#DCD9D0; --steel:#5A6472;
          --signal:#F5C400; --ok:#1E7A46; --gap:#C74E19; --gapbg:#FDF0E8; --fact:#1450B4; --factbg:#EAF1FD; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:Archivo,sans-serif; background:var(--paper); color:var(--ink); }
  /* Do not lock the whole page — only the editor shell scrolls internally */
  header {
    display:flex; align-items:center; gap:12px; min-height:52px; padding:8px 18px;
    background:var(--ink); color:#fff; flex-shrink:0; flex-wrap:wrap;
    position:sticky; top:0; z-index:50;
  }
  /* Foldok mark: […] — code blocks, data gaps, folder/page geometry (no tile) */
  header .logo {
    display:inline-flex; align-items:center; justify-content:center;
    background:transparent; color:var(--signal);
    border-radius:0; padding:0;
    font-family:"IBM Plex Mono",monospace;
    font-weight:700; font-size:22px; letter-spacing:-0.06em;
    line-height:1; user-select:none;
  }
  header .brand-home {
    display:inline-flex; align-items:center; gap:12px;
    color:inherit; text-decoration:none; cursor:pointer;
  }
  header b { font-size:14px; letter-spacing:.06em; font-weight:800; }
  header .doc-meta {
    display:inline-flex; flex-wrap:wrap; align-items:baseline; gap:6px 0;
    margin-left:6px; padding-left:12px;
    border-left:1px solid rgba(255,255,255,.18);
    font-family:"IBM Plex Mono",monospace; font-size:10px; line-height:1.35;
    color:rgba(255,255,255,.72);
  }
  header .doc-meta .dm { display:inline-flex; align-items:baseline; gap:5px; white-space:nowrap; }
  header .doc-meta .dm + .dm::before {
    content:""; display:inline-block; width:3px; height:3px; margin:0 10px 0 8px;
    border-radius:50%; background:rgba(245,196,0,.55); align-self:center; flex-shrink:0;
  }
  header .doc-meta .dm em {
    font-style:normal; font-size:8.5px; font-weight:700; letter-spacing:.1em;
    text-transform:uppercase; color:rgba(255,255,255,.42);
  }
  header .doc-meta .dm strong { font-weight:600; color:rgba(255,255,255,.88); }
  header .ver {
    font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--signal);
    display:inline-flex; align-items:baseline; gap:6px;
  }
  header .ver .ver-label {
    font-style:normal; font-size:8.5px; font-weight:700; letter-spacing:.1em;
    text-transform:uppercase; color:rgba(255,255,255,.42);
  }
  header .doc-meta .dm-lang button.lang-pick {
    background:transparent; border:none; padding:0; margin:0; cursor:pointer;
    font:inherit; color:inherit;
  }
  header .doc-meta .dm-lang button.lang-pick strong {
    font-weight:600; color:rgba(255,255,255,.38); pointer-events:none;
  }
  header .doc-meta .dm-lang button.lang-pick.on strong,
  header .doc-meta .dm-lang button.lang-pick strong.on {
    color:var(--signal);
  }
  header .doc-meta .dm-lang .lang-sep { color:rgba(255,255,255,.28); margin:0 3px; }
  /* Show only active language blocks site-wide */
  [data-l="en"], [data-l="no"] { display: none !important; }
  html[lang="en"] [data-l="en"],
  html[lang="nb"] [data-l="no"],
  html[data-lang="en"] [data-l="en"],
  html[data-lang="no"] [data-l="no"],
  body[data-lang="en"] [data-l="en"],
  body[data-lang="no"] [data-l="no"] { display: inline !important; }
  html[lang="en"] h2[data-l="en"], html[lang="nb"] h2[data-l="no"],
  body[data-lang="en"] h2[data-l="en"], body[data-lang="no"] h2[data-l="no"],
  html[lang="en"] p[data-l="en"], html[lang="nb"] p[data-l="no"],
  body[data-lang="en"] p[data-l="en"], body[data-lang="no"] p[data-l="no"],
  html[lang="en"] li[data-l="en"], html[lang="nb"] li[data-l="no"],
  body[data-lang="en"] li[data-l="en"], body[data-lang="no"] li[data-l="no"],
  html[lang="en"] .story-kicker[data-l="en"], html[lang="nb"] .story-kicker[data-l="no"],
  body[data-lang="en"] .story-kicker[data-l="en"], body[data-lang="no"] .story-kicker[data-l="no"],
  html[lang="en"] div[data-l="en"], html[lang="nb"] div[data-l="no"],
  body[data-lang="en"] div[data-l="en"], body[data-lang="no"] div[data-l="no"] {
    display: block !important;
  }
  @media (max-width:900px) {
    header .doc-meta { margin-left:0; padding-left:0; border-left:none; width:100%; order:3; }
  }
  header .right {
    margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:11px; color:#c8ccd2;
    position:relative; z-index:90; flex-shrink:0;
  }
  main { max-width:960px; margin:0 auto; padding:28px 20px 80px; }
  /* Project page: same column / type scale as the hub landing */
  main.editor-mode {
    max-width:960px; margin:0 auto; padding:28px 20px 80px;
  }
  main.editor-mode #doc-panel {
    margin-top:8px;
  }
  /* Step 3 (REDIGER): full-bleed when scrolled into view */
  #doc-panel-ph { width:100%; pointer-events:none; visibility:hidden; }
  body.editor-immersive #doc-panel {
    position:fixed;
    top:52px; left:0; right:0; bottom:0;
    z-index:35;
    margin:0;
    padding:0 12px 12px;
    box-sizing:border-box;
    display:flex;
    gap:12px;
    background:var(--paper);
    max-width:none;
    width:100%;
  }
  body.editor-immersive #doc-panel > .stepnum {
    display:none;
  }
  body.editor-immersive #doc-panel > .card {
    flex:1;
    margin:0;
    border-radius:12px;
    display:flex;
    flex-direction:column;
    min-height:0;
    padding:12px 14px !important;
    overflow:hidden;
  }
  body.editor-immersive #doc-panel .editor-shell {
    flex:1;
    min-height:0;
    height:auto !important;
    max-height:none;
    grid-template-columns:minmax(0,1fr) minmax(300px,380px);
  }
  body.editor-immersive #doc-panel .editor-work-body {
    grid-template-columns:minmax(220px,260px) minmax(0,1fr);
  }
  body.editor-immersive #doc-panel .assist-sheet-toggle {
    display:none;
  }
  .immersive-exit {
    display:none;
    position:fixed; top:60px; right:20px; z-index:40;
    font-size:11px; font-weight:700; padding:5px 11px;
    border:1px solid var(--line); border-radius:6px;
    background:var(--sheet); color:var(--steel); cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
  }
  body.editor-immersive .immersive-exit { display:inline-block; }
  main.editor-mode .editor-shell {
    height:min(78vh, 900px);
    min-height:520px;
    max-height:none;
    overflow:hidden;
    align-items:stretch;
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(280px,320px);
    gap:0;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--sheet);
  }
  main.editor-mode .editor-work {
    min-height:0; height:100%; overflow:hidden; border-radius:0; border:none; border-right:1px solid var(--line);
    display:flex; flex-direction:column;
  }
  main.editor-mode .editor-work-body {
    flex:1; min-height:0; overflow:hidden;
    display:grid;
    grid-template-columns:minmax(200px,220px) minmax(0,1fr);
  }
  main.editor-mode .editor-canvas {
    height:auto; min-height:0; overflow-y:auto; overflow-x:hidden;
  }
  main.editor-mode .assist-dock {
    position:relative; top:auto;
    height:100%; max-height:none;
    align-self:stretch;
    border-radius:0; border:none; border-left:1px solid var(--line);
  }
  @media (max-width:1100px) {
    main.editor-mode .editor-shell {
      grid-template-columns:minmax(0,1fr);
      height:auto;
      min-height:0;
    }
    main.editor-mode .assist-dock {
      display:none; position:fixed; right:0; top:52px; bottom:0; width:min(360px,100vw);
      z-index:40; border-left:1px solid var(--line); box-shadow:-8px 0 24px rgba(0,0,0,.12);
    }
    main.editor-mode .assist-dock.open { display:flex; }
    main.editor-mode .editor-work-body {
      grid-template-columns:minmax(180px,200px) minmax(0,1fr);
      min-height:60vh;
    }
  }
  h1 { font-size:24px; font-weight:900; margin:0 0 4px; }
  .sub { color:var(--steel); font-size:13.5px; margin-bottom:22px; }
  .card { background:var(--sheet); border:1px solid var(--line); border-radius:10px; padding:20px 22px; margin-bottom:16px; }
  .label { font-size:10px; font-weight:800; letter-spacing:.12em; color:var(--steel); margin-bottom:10px; }
  button { font-family:Archivo,sans-serif; cursor:pointer; }
  .btn { font-weight:800; font-size:13px; background:var(--signal); color:var(--ink); border:none; border-radius:7px; padding:10px 18px; }
  .btn:disabled { background:#E4E1D8; color:var(--steel); cursor:not-allowed; }
  .btn.ghost { background:transparent; border:1px solid var(--line); color:var(--steel); font-weight:700; }
  .btn.dark { background:var(--ink); color:#fff; }
  input, select, textarea { font-family:Archivo,sans-serif; font-size:13px; padding:9px 11px; border:1px solid var(--line); border-radius:7px; background:#FBFAF6; width:100%; }
  textarea { font-family:"IBM Plex Mono",monospace; font-size:11.5px; }
  .mono { font-family:"IBM Plex Mono",monospace; }
  .proj { display:flex; align-items:center; gap:14px; padding:14px 16px; background:var(--sheet); border:1px solid var(--line); border-radius:10px; margin-bottom:10px; cursor:pointer; transition:border-color .12s; }
  .proj:hover { border-color:var(--ink); }
  .proj .ic { width:38px; height:38px; border-radius:8px; background:var(--paper); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:17px; }
  .proj small { color:var(--steel); font-size:11.5px; display:block; }
  .step { display:flex; gap:14px; margin-bottom:14px; }
  .stepnum { width:30px; height:30px; border-radius:99px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:13px; border:2px solid var(--line); background:var(--sheet); color:var(--steel); margin-top:16px; }
  .stepnum.on { border-color:var(--ink); background:var(--ink); color:#fff; }
  .stepnum.ok { border-color:var(--ok); background:var(--ok); color:#fff; }
  .step .card { flex:1; margin-bottom:0; }
  .filerow { display:flex; align-items:center; gap:10px; padding:7px 8px; border-bottom:1px solid var(--line); font-size:12.5px; border-radius:6px; cursor:pointer; user-select:none; }
  .filerow:last-child { border-bottom:none; }
  .filerow.src-on { background:#F3FAF5; color:var(--ink); }
  .filerow.src-on:hover { background:#E8F5EC; }
  .filerow.src-off { background:transparent; color:#A8AEB6; opacity:.72; }
  .filerow.src-off b, .filerow.src-off .cap { color:#A8AEB6; }
  .filerow.src-off:hover { background:#F5F4F0; opacity:.9; }
  .filerow.src-locked { cursor:default; opacity:.55; } /* CAD / skipped formats */
  .folder-chip {
    font-family:"IBM Plex Mono",monospace; font-size:10.5px; padding:5px 11px;
    border-radius:99px; margin:0 4px 4px 0; display:inline-flex; align-items:center; gap:6px;
    cursor:pointer; user-select:none; border:1.5px solid var(--line); background:var(--sheet); color:var(--ink);
  }
  .folder-chip.src-on { border-color:var(--ok); background:#E8F5EC; color:var(--ok); font-weight:700; }
  .folder-chip.src-off { border-color:var(--line); background:#F0EEE8; color:#9AA0A8; font-weight:600; }
  .folder-chip .dot { width:7px; height:7px; border-radius:50%; background:currentColor; flex-shrink:0; }
  .src-pick-hint { font-size:11.5px; color:var(--steel); margin:6px 0 4px; }
  .src-pick-bar {
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:12px;
    padding-top:12px; border-top:1px solid var(--line);
  }
  .kindtag { font-family:"IBM Plex Mono",monospace; font-size:9px; font-weight:700; padding:2px 6px; border-radius:3px; background:var(--paper); border:1px solid var(--line); color:var(--steel); width:44px; text-align:center; flex-shrink:0; }
  .chip { font-family:"IBM Plex Mono",monospace; font-size:10px; font-weight:700; padding:2px 8px; border-radius:99px; }
  .chip.ok { background:#E8F5EC; color:var(--ok); }
  .chip.wait { background:#FFF6CE; color:#8a6d00; }
  .cap { color:var(--steel); font-size:11.5px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .progress { height:8px; background:var(--paper); border-radius:99px; overflow:hidden; margin:10px 0 6px; }
  .progress i { display:block; height:100%; background:var(--signal); transition:width .3s; }
  .gaprow { display:flex; gap:8px; align-items:baseline; padding:6px 10px; border-radius:6px; margin-bottom:5px; font-size:12.5px; }
  .gaprow.blocking { background:var(--gapbg); color:var(--gap); }
  .gaprow.warning { background:#FFF8E0; color:#8a6d00; }
  .gaprow.info { background:var(--factbg); color:var(--fact); }
  .gaprow .sev { font-family:"IBM Plex Mono",monospace; font-size:9px; font-weight:700; text-transform:uppercase; flex-shrink:0; }
  .pill { font-family:"IBM Plex Mono",monospace; font-size:10.5px; padding:3px 9px; background:var(--sheet); border:1px solid var(--line); border-radius:99px; margin:0 4px 4px 0; display:inline-block; }
  .draft { background:var(--sheet); border:1px solid var(--line); border-radius:10px; padding:36px 42px; max-width:100%; min-width:0; box-sizing:border-box; overflow-x:auto; overflow-y:visible; }
  .draft .table-wrap { overflow-x:auto; max-width:100%; margin:10px 0; -webkit-overflow-scrolling:touch; }
  .draft table { width:100%; border-collapse:collapse; font-size:12px; margin:0; table-layout:fixed; }
  .draft th,.draft td { border:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; word-break:break-word; overflow-wrap:anywhere; }
  .draft h1 { font-size:24px; } .draft h2 { font-size:17px; border-bottom:2px solid var(--ink); padding-bottom:5px; margin-top:28px; }
  .draft th { background:var(--paper); }
  .draft strong { color:var(--fact); }
  .draft em { color:var(--steel); font-size:12px; }
  .draft code,.mangler { font-family:"IBM Plex Mono",monospace; font-size:11.5px; font-weight:600; background:var(--gapbg); color:var(--gap); padding:2px 6px; border-radius:4px; }
  .err { background:var(--gapbg); color:var(--gap); padding:10px 14px; border-radius:8px; font-size:13px; margin:10px 0; }
  .crumb { font-size:12.5px; color:var(--steel); margin-bottom:14px; }
  .crumb a { color:var(--fact); text-decoration:none; font-weight:700; cursor:pointer; }
  .artifact-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:8px; }
  .artifact-grid .box { background:#FBFAF6; border:1px solid var(--line); border-radius:8px; padding:12px 14px; font-size:12.5px; }
  .a-shell { display:grid; grid-template-columns:minmax(0,1fr); gap:12px; margin-top:10px; align-items:stretch; }
  .a-shell.with-model { grid-template-columns:minmax(0,1fr) minmax(220px,280px); }
  @media (max-width:900px) { .a-shell.with-model { grid-template-columns:minmax(0,1fr); } .a-model-panel { display:none; } }
  .a-chat {
    background:var(--sheet); border:1px solid var(--line); border-radius:12px;
    display:flex; flex-direction:column; height:min(58vh, 520px); overflow:hidden;
  }
  /* Compact handoff when document is open — must NOT inherit .a-chat height */
  .a-chat-bridge {
    background:var(--sheet); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; display:flex; flex-wrap:wrap; align-items:flex-start; gap:10px 14px;
  }
  .a-chat-bridge .understood-block { flex:1; min-width:220px; }
  .a-chat-bridge .understood-kicker {
    font-family:"IBM Plex Mono",monospace; font-size:10px; font-weight:700;
    letter-spacing:.06em; text-transform:uppercase; color:var(--steel); margin:0 0 4px;
  }
  .a-chat-bridge .understood-title {
    font-size:14px; font-weight:700; color:var(--ink); margin:0 0 6px; line-height:1.35;
  }
  .a-chat-bridge .understood-title .mono { font-weight:600; color:var(--ok); font-size:12px; }
  .a-chat-bridge .understood-line {
    margin:0 0 4px; font-size:13px; line-height:1.45; color:var(--ink);
  }
  .a-chat-bridge .understood-line.muted { color:var(--steel); }
  .a-chat-bridge .understood-line b { color:var(--ink); font-weight:700; }
  .a-chat-bridge > .btn { flex-shrink:0; align-self:center; }
  .a-chat .log {
    flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:10px;
  }
  .a-chat .compose {
    display:flex; gap:8px; padding:12px 14px; border-top:1px solid var(--line); background:#FBFAF6;
  }
  .a-chat .compose input { flex:1; font-size:14px; padding:11px 12px; }
  .a-chat .hints { display:flex; flex-wrap:wrap; gap:6px; padding:0 14px 10px; }
  .a-chat .hints button {
    font-size:11px; padding:5px 10px; border-radius:99px; border:1px solid var(--line);
    background:var(--sheet); cursor:pointer; color:var(--steel);
  }
  .a-chat .hints button:hover { border-color:var(--ink); color:var(--ink); }
  .a-model-panel {
    background:var(--sheet); border:1px solid var(--line); border-radius:12px;
    display:flex; flex-direction:column; max-height:min(58vh, 520px); overflow:hidden;
  }
  .a-model-panel .hd { padding:10px 12px; border-bottom:1px solid var(--line); font-size:12px; font-weight:800; flex-shrink:0; }
  .a-model-panel .bd { flex:1; overflow-y:auto; padding:10px 12px; font-size:12.5px; }
  .a-model-panel .sec-label { font-family:"IBM Plex Mono",monospace; font-size:9.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--steel); margin:10px 0 6px; }
  .a-model-panel .sec-label:first-child { margin-top:0; }
  .a-head-row { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .a-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; align-items:center; }
  .a-rail-toggle { font-size:11px; font-weight:700; color:var(--steel); background:transparent; border:1px solid var(--line); border-radius:6px; padding:4px 10px; cursor:pointer; }
  .a-chip { display:flex; align-items:flex-start; gap:6px; background:#FBFAF6; border:1px solid var(--line); border-radius:8px; padding:7px 9px; margin-bottom:5px; font-size:12px; }
  .a-chip .txt { flex:1; min-width:0; }
  .a-chip .src { font-size:10px; color:var(--fact); cursor:pointer; font-weight:700; margin-top:3px; }
  .a-chip button.x { border:none; background:transparent; color:var(--steel); cursor:pointer; font-weight:800; padding:0 4px; }
  .a-chip button.x:hover { color:var(--gap); }
  .a-more { margin-top:10px; }
  .a-more summary { font-size:11px; font-weight:700; color:var(--steel); cursor:pointer; }
  .a-funn .funn-row { display:flex; align-items:flex-start; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); font-size:12px; }
  .a-funn .funn-row:last-child { border-bottom:none; }
  .a-funn .funn-src { font-size:10px; color:var(--steel); margin-top:2px; }
  .a-funn .funn-ask { font-size:10px; font-weight:700; color:var(--fact); background:transparent; border:none; cursor:pointer; padding:0; white-space:nowrap; }
  .a-patch-note { font-size:11px; color:var(--ok); margin-top:6px; font-weight:600; }
  .agree-card { background:#F7FAF8; border:1px solid var(--ok); border-radius:10px; padding:12px 14px; margin-top:4px; }
  .agree-card .agree-title { font-size:15px; margin:6px 0 4px; }
  .agree-card .agree-why { font-size:12.5px; color:var(--ink); margin-bottom:8px; line-height:1.4; }
  .agree-card .agree-meta { font-size:11.5px; color:var(--steel); margin:4px 0; }
  .agree-card .agree-model { font-size:12px; background:var(--sheet); border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:8px 0; line-height:1.4; }
  .agree-card .acts { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px; }
  .agree-card details.agree-alt { font-size:12px; }
  .agree-card details.agree-alt summary { cursor:pointer; color:var(--steel); font-weight:700; }
  .agree-card details.agree-alt select { display:block; margin-top:6px; max-width:100%; }
  .a-manual { margin-top:10px; font-size:12px; }
  .a-manual summary { cursor:pointer; color:var(--steel); font-weight:700; font-size:11.5px; }
  .doc-tabs { display:flex; flex-wrap:wrap; gap:0; border-bottom:1px solid var(--line); margin-bottom:12px; }
  .doc-tabs button {
    font-size:12.5px; font-weight:700; padding:10px 14px; border:none; background:transparent;
    color:var(--steel); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;

const $ = s => document.querySelector(s);
const esc = s => (s || "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
function shortName(name) { return (name || "").split(" / ")[0].trim(); }
function docLabel(p, template) {
  if (!template) return "Utkast";
  const d = (p.documents || []).find(x => x.template === template);
  if (d?.export_name) return d.export_name;
  if (d?.name_no) return shortName(d.name_no);
  const t = (BOOT?.templates || []).find(x => x.file === template);
  return shortName(t?.name_no || t?.name || template.replace(".json", ""));
}
function relExportPath(fullPath, folders) {
  if (!fullPath || !folders?.[0]) return fullPath || "";
  const root = folders[0].replace(/\\/g, "/");
  const fp = fullPath.replace(/\\/g, "/");
  if (fp.startsWith(root)) return fp.slice(root.length).replace(/^\//, "");
  return fullPath;
}
const api = (p, opt) => fetch(p, opt).then(async r => {
  const j = r.headers.get("content-type")?.includes("json") ? await r.json() : await r.text();
  if (!r.ok) {
    const err = new Error((j && j.error) || r.status);
    err.status = r.status;
    err.payload = j;
    throw err;
  }
  return j;
});

async function boot() {
  try {
    BOOT = await api("/api/bootstrap");
  } catch (_) {
    // Static / marketing host (e.g. Vercel) — same UI as local home, no engine APIs
    let meta = { document: "FOLDOK-WEB-001", revision: "C", date: "auto", default_language: "en" };
    try {
      const r = await fetch("/site-meta.json");
      if (r.ok) meta = await r.json();
    } catch (_) {}
    let ver = "0.72.0";
    try {
      const vr = await fetch("/VERSION");
      if (vr.ok) ver = (await vr.text()).trim() || ver;
    } catch (_) {}
    BOOT = {
      version: ver,
      projects: [],
      templates: [],
      capabilities: [],
      account: { signed_in: false },
      web_meta: meta,
      marketing: true,
    };
  }
  applyHeaderMeta(BOOT.web_meta || { version: BOOT.version });
  renderAccountHeader();
  // Don't POST /api/pick-folder here — that opens a native dialog and blocks the UI.
  const ver = String(BOOT.version || "0");
  const parts = ver.split(".").map(Number);
  const stale = !BOOT.marketing && ((parts[0] || 0) < 0 || (parts[0] === 0 && (parts[1] || 0) < 16) ||
    (parts[0] === 0 && parts[1] === 16 && (parts[2] || 0) < 6));
  if (stale) {
    $("#keystate").textContent = "⚠ Gammel server (v" + ver + ") — restart workbench.ps1";

  route();
}

function t(key) {
  const lang = getUiLang();
  return (UI_I18N[lang] && UI_I18N[lang][key])
    || (UI_I18N.en && UI_I18N.en[key])
    || key;
}

/** Inline bilingual helper for landing/marketing copy */
function L(no, en) {
  return getUiLang() === "no" ? no : en;
}

/** Display currency follows UI language: NO → NOK, EN → EUR */
function getCurrency() {
  return getUiLang() === "no" ? "NOK" : "EUR";
}

function freeLabel() { return L("gratis", "free"); }

/** Format a EUR ledger amount into the active display currency */
function fmtMoney(eurAmount, opts = {}) {
  const n = Number(eurAmount || 0);
  const code = opts.code || getCurrency();
  // Display FX only — account ledger remains EUR on the server
  const rate = { EUR: 1, USD: 1.08, NOK: 11.5 }[code] || 1;
  const v = n * rate;
  if (code === "NOK") {
    const rounded = Math.round(v);
    return rounded.toLocaleString("nb-NO") + "\u00a0kr";
  }
  if (code === "USD") {
    return "$" + v.toFixed(2);
  }
  // EUR
  if (getUiLang() === "no") return "€" + v.toFixed(2).replace(".", ",");
  return "€" + v.toFixed(2);
}

function fmtEur(n) { return fmtMoney(n); }

function moneyRange(loEur, hiEur) {
  if (hiEur == null || hiEur === loEur) return fmtMoney(loEur);
  return fmtMoney(loEur) + "–" + fmtMoney(hiEur);
}

function todayISO() {
  const d = new Date();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${d.getFullYear()}-${m}-${day}`;
}

function getUiLang() {
  const saved = (localStorage.getItem("foldok_ui_lang") || "").toLowerCase();
  if (saved === "no" || saved === "en") return saved;
  const def = (BOOT?.web_meta?.default_language || "en").toLowerCase();
  return def === "no" ? "no" : "en";
}

function applyHeaderMeta(meta) {
  meta = meta || {};
  const version = meta.version || BOOT?.version || "";
  const verEl = $("#ver");
  if (verEl && version) verEl.textContent = "v" + String(version).replace(/^v/i, "");
  const doc = meta.document || "FOLDOK-WEB-001";
  const rev = meta.revision || "C";
  let date = meta.date;
  if (!date || date === "auto" || date === "—") date = todayISO();
  const set = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text; };
  set("meta-doc", doc);
  set("meta-rev", rev);
  set("meta-date", date);
  window.__foldok_web_meta = { document: doc, revision: rev, date, version };
  document.querySelectorAll(".meta-compiled-rev").forEach(el => {
    el.textContent = `REV ${rev} · ${date}`;
  });
  applyUiLang(getUiLang(), { skipRerender: true });
}

function applyUiLang(lang, opts = {}) {
  lang = lang === "no" ? "no" : "en";
  window.__foldok_ui_lang = lang;
  localStorage.setItem("foldok_ui_lang", lang);
  document.documentElement.lang = lang === "no" ? "nb" : "en";
  document.documentElement.setAttribute("data-lang", lang);
  document.body.setAttribute("data-lang", lang);
  const pack = UI_I18N[lang] || UI_I18N.en;
  $("#meta-lang-no-btn")?.classList.toggle("on", lang === "no");
  $("#meta-lang-en-btn")?.classList.toggle("on", lang === "en");
  $("#meta-lang-no")?.classList.toggle("on", lang === "no");
  $("#meta-lang-en")?.classList.toggle("on", lang === "en");
  const home = document.querySelector("header .brand-home");
  if (home) home.title = pack.brandTitle;
  // Live hub chrome (if already on page)
  document.querySelectorAll(".hub-tag").forEach(el => {
    if (el.querySelector("#cmeter")) return;
    el.textContent = pack.hubTag;
  });
  document.querySelectorAll("#hub-in, #hub-in-clone").forEach(el => {
    el.placeholder = pack.hubPh;
  });
  document.querySelectorAll(".hub-chat .compose .btn").forEach(el => {
    if (!el.classList.contains("chat-attach-btn")) el.textContent = pack.hubSend;
  });
}

function setUiLang(lang, ev) {
  ev?.preventDefault?.();
  ev?.stopPropagation?.();
  lang = lang === "no" ? "no" : "en";
  applyUiLang(lang);
  HUB_CHAT_HTML = "";
  try {
    if (location.hash && location.hash.startsWith("#/p/")) {
      renderAccountHeader();
    } else {
      renderHome();
      applyUiLang(lang);
      applyHeaderMeta(BOOT?.web_meta || window.__foldok_web_meta || { version: BOOT?.version });
    }
  } catch (_) {}
}

  const pan = $("#acct-panel");
  if (!pan) return;
  if (pan.classList.contains("open")) {
    pan.classList.remove("open");
    return;
  }
  renderAccountPanel({ keepOpen: true, forceOpen: true });
}

(function bindAccountPanelClicks() {
  const pan = $("#acct-panel");
  if (!pan || pan.dataset.bound === "1") return;
  pan.dataset.bound = "1";
  // Keep all panel clicks local — tab re-renders must not look like outside clicks
  pan.addEventListener("click", (e) => {
    e.stopPropagation();
    const tab = e.target instanceof Element ? e.target.closest("[data-acct-tab]") : null;
    if (tab) {
      const id = tab.getAttribute("data-acct-tab");
      if (id) switchAccountTab(id);
    }
  });
})();

document.addEventListener("click", (e) => {
  const pan = $("#acct-panel");
  if (!pan?.classList.contains("open")) return;
  if (!(e.target instanceof Element)) return;
  if (e.target.closest("#acct-toggle")) return;
  // Tab re-renders detach the click target — don't treat that as an outside click
  if (!e.target.isConnected) return;
  if (e.target.closest("#acct-panel")) return;
  pan.classList.remove("open");
});

function exportButtonLabel() {
  const d = activeDocMeta();

function setupLandingLoop() {
  if (typeof LANDING_LOOP_CLEANUP === "function") {
    LANDING_LOOP_CLEANUP();
    LANDING_LOOP_CLEANUP = null;
  }
  const cycles = document.querySelectorAll(".landing-cycle");
  if (cycles.length < 2) return;
  let locking = false;
  let unlockTimer = null;

  const cycleSpan = () => Math.max(0, cycles[1].offsetTop - cycles[0].offsetTop);

  const lockBriefly = () => {
    locking = true;
    if (unlockTimer) clearTimeout(unlockTimer);
    unlockTimer = setTimeout(() => { locking = false; unlockTimer = null; }, 50);
  };

  // Seamless loop only when scrolling down past the first cycle.
  // Do NOT jump upward from the top into the clone — that hid the header
  // and felt like teleporting to the bottom of the page.
  const wrap = () => {
    if (locking) return;
    const h = cycleSpan();
    if (h < 240) return;
    const y = window.scrollY || document.documentElement.scrollTop || 0;
    if (y >= h) {
      lockBriefly();
      window.scrollTo({ top: y - h, behavior: "auto" });
    }
  };

  window.addEventListener("scroll", wrap, { passive: true });
  LANDING_LOOP_CLEANUP = () => {
    window.removeEventListener("scroll", wrap);
    if (unlockTimer) clearTimeout(unlockTimer);
    locking = false;
  };
}

    panel.querySelector("#fb-use").onclick = confirmFolderBrowser;
    const list = panel.querySelector("#fb-list");
    if (j.parent) list.appendChild(mkRow("↑ Opp et nivå", j.parent));
    (j.entries || []).forEach(e => list.appendChild(mkRow("📁 " + e.name, e.path)));
    if (!(j.entries || []).length && !j.parent)
      list.innerHTML = `<div class="mono" style="padding:12px;color:var(--steel)">Ingen mapper funnet</div>`;
  } catch (e) {
    overlay.innerHTML = `<div class="panel"><div class="hd">Velg mappe</div>
      <div class="err" style="margin:12px">${esc(e.message)}</div>
      <div class="ft"><button class="btn ghost" onclick="closeFolderBrowser()">Lukk</button></div></div>`;
  }
}

function closeFolderBrowser() {
  const overlay = $("#folder-browser");
  if (overlay) {
    overlay.style.display = "none";
    delete overlay.dataset.mode;
    delete overlay.dataset.projectId;
  }
}

async function createProject() {
  $("#np-err").innerHTML = "";
  syncProjectNameFromFolder(false);
  const folder = ($("#np-folder").value || "").trim();
  const name = ($("#np-name").value || "").trim() || folderBasename(folder);
  if (!folder) {
    $("#np-err").innerHTML = `<div class="err">Lim inn en mappesti eller velg mappe først.</div>`;
    return;
  }
  const btn = document.querySelector('button[onclick="createProject()"]');
  if (btn) { btn.disabled = true; btn.textContent = "Oppretter…"; }
  try {
    const p = await api("/api/projects", { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ name, folder }) });
    BOOT.projects.push(p);
    location.hash = "#/p/" + p.id;
  } catch (e) {
    $("#np-err").innerHTML = `<div class="err">${esc(e.message)}</div>`;
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "+ Opprett prosjekt"; }
  }
}

function renderSuggestionsHTML(p, id) {
  const sugs = p.suggestions || [];
  if (!sugs.length) return "";
  return `<div style="margin-top:12px">
    <div class="label">FORSLAG (valgfritt)</div>
    <div class="suggest-row">${sugs.map(s => `
      <div class="suggest-card" title="Funn: ${esc(s.evidence || "")}">
        <b>${esc(s.label || s.name)}</b>
        <div class="ev">${esc(s.reason)} · funn: ${esc(s.evidence || "—")}</div>
        <div class="acts">
          ${s.type === "supersede_revision" && s.file ? `<button type="button" class="btn ghost" style="padding:4px 10px;font-size:11px"
            onclick="applySupersedeSuggestion('${id}','${esc(s.name).replace(/'/g, "\\'")}','${esc(s.file).replace(/'/g, "\\'")}')">Ekskluder fil</button>` : ""}
          ${s.template_key ? `<button type="button" class="btn ghost" style="padding:4px 10px;font-size:11px"
            onclick="createFromSuggestion('${id}','${esc(s.template_key).replace(/'/g, "\\'")}','${esc(s.name).replace(/'/g, "\\'")}')">+ Opprett</button>` : ""}
          <button type="button" class="btn ghost" style="padding:4px 10px;font-size:11px"
            onclick="dismissSuggestion('${id}','${esc(s.name).replace(/'/g, "\\'")}')">×</button>
        </div>
      </div>`).join("")}</div></div>`;
}

async function dismissSuggestion(id, name) {
  try {
    await api("/api/suggestions/dismiss", { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ id, name }) });
    showToast("Forslag avvist");
    await renderProject(id);
  } catch (e) { alert(e.message); }
}

async function applySupersedeSuggestion(id, name, file) {
  if (!confirm(`Slå av «${file.split("/").pop()}» i dette dokumentet?`)) return;
  try {
    await api("/api/doc/toggle-source", { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ id, template: ACTIVE_DOC, file, on: false }) });
    await dismissSuggestion(id, name);
    showToast("Eldre revisjon ekskludert fra dokumentet");
    await renderProject(id);
  } catch (e) { alert(e.message); }
}

async function createFromSuggestion(id, templateKey, name) {
  const t = (BOOT?.templates || []).find(x => x.key === templateKey);
  if (t?.file) {
    INTENT_PICK = { file: t.file, name_no: t.name_no, choice: t.key, why_no: name || t.name_no };
    await lagDokumentet(t.file);
    return;
  }
  if (!confirm(`Opprette «${name}»? (genererer nytt dokument)`)) return;
  try {
    const r = await api("/api/suggestions/create", { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ id, template_key: templateKey || undefined }) });
    if (r.job_id) pollJob(r.job_id, id);
    showToast("Genererer dokument…");
  } catch (e) { alert(e.message); }
}

function openBomMangler(section, innerEnc, likelyFileEnc) {
  openManglerMenu("bom_qty", section, "warning", null);
  setTimeout(() => {
    manglerPanel("source");
    const sel = document.getElementById("mp-source-file");
    const hint = document.getElementById("mp-hint");
    if (hint) hint.value = "element instanser — qty, length_mm, profil";
    if (likelyFileEnc && sel) {
      const needle = decodeURIComponent(likelyFileEnc).toLowerCase();
      for (const opt of sel.options) {
        if (opt.value.toLowerCase().includes(needle) || opt.text.toLowerCase().includes(needle)) {
          sel.value = opt.value;
          break;
        }
      }
    }
  }, 30);
}

async function renderProject(id) {
  if (typeof LANDING_LOOP_CLEANUP === "function") {
    LANDING_LOOP_CLEANUP();
    LANDING_LOOP_CLEANUP = null;
  }
  let p = await api("/api/project?id=" + id);
  if (LAST_PID !== id) {
    ACTIVE_DOC = null;
    LAST_PID = id;
    FOLDER_BANNER_DISMISSED = false;
    CHAT_SCOPE = { type: "document", section: null };
    CHAT_TURNS = 0;
    CHAT_HTML = "";
    // BUGFIX 0.19 — Checkpoint-A chat must not leak across projects
    A_CHAT_HTML = "";
    A_PENDING_PATCH = null;
    A_SHOW_MODEL = false;
    A_USER_TURNS = [];
    INTENT_RESULT_HTML = "";
    INTENT_STORY = "";
    ARTIFACT_DRAFT = null;
    try {
      const openDoc = sessionStorage.getItem("foldok_open_doc");
      if (openDoc) {
        ACTIVE_DOC = openDoc;
        sessionStorage.removeItem("foldok_open_doc");
      }
    } catch (_) {}
  }
  const docs = p.documents || [];
  if (!ACTIVE_DOC || !docs.some(d => d.template === ACTIVE_DOC))
    ACTIVE_DOC = p.active_template || p.template || (docs[0] && docs[0].template);
  if (ACTIVE_DOC) {
    p = await api("/api/project?id=" + id + "&template=" + encodeURIComponent(ACTIVE_DOC));
  }
  PROJECT = p;
  // Folder-less is OK — do not treat empty folders as missing
  if (p.missing && (p.missing_folders || []).length) {
    $("#main").innerHTML = `<div class="err">Mappe(r) finnes ikke lenger: ${(p.missing_folders || []).map(esc).join(", ")}</div>`;
    return;
  }

  const warnBanner = p.product_repo_warn
    ? `<div class="err" style="margin-bottom:16px"><b>Feil mappe.</b> Dette er Foldok-produktmappen, ikke et kundeprosjekt.
       UI-skjermbilder i <code>capture/</code> blir da indeksert som kilder. Bruk en ekte prosjektmappe
       (f.eks. <b>Demoprosjektet</b>). Mappene <code>capture/</code> og <code>foldok-engine/</code> hoppes over ved indeksering.</div>`
    : "";

  const unindexed = p.files.filter(f => !f.indexed && f.kind !== "skipped" && f.kind !== "cad").length;
  const indexed = p.files.filter(f => f.indexed && f.kind !== "skipped" && f.kind !== "cad").length;
  const skipped = p.files.filter(f => f.kind === "skipped" || f.kind === "cad").length;
  const cadN = p.files.filter(f => f.kind === "cad").length;
  const step1ok = unindexed === 0 && indexed > 0;
  const step2ok = !!p.artifact && p.confirmed;
  const step3ok = docs.length > 0 || p.draft_exists;
  const activeDoc = docs.find(d => d.template === ACTIVE_DOC);
  const resultLabel = docLabel(p, ACTIVE_DOC);

  const sourcesMeta = [
    `${indexed} indeksert`,
    unindexed ? `${unindexed} venter` : null,
    cadN ? `${cadN} CAD` : null,
    (skipped - cadN) > 0 ? `${skipped - cadN} andre hoppes over` : null,
  ].filter(Boolean).join(" · ");

  const SHOW_FILES = window.__showAllFiles ? p.files.length : Math.min(p.files.length, 8);
  const fileRows = p.files.slice(0, SHOW_FILES).map(f => {
    const locked = f.kind === "cad" || f.kind === "skipped";
    const on = locked ? false : (f.enabled !== false);
    const nameEsc = esc(f.name).replace(/'/g, "\\'");
    const cls = locked ? "filerow src-locked" : (on ? "filerow src-on" : "filerow src-off");
    const toggle = locked
      ? ""
      : `onclick="event.preventDefault();toggleProjectSource('file','${nameEsc}', ${!on})"`;
    const openBtn = `<button type="button" class="btn ghost" style="padding:2px 8px;font-size:10px;flex-shrink:0"
      onclick="event.stopPropagation();openSourceFile('${nameEsc}')" title="Åpne fil">Åpne</button>`;
    return `
    <div class="${cls}" ${toggle} title="${locked ? "Kan ikke indekseres her" : (on ? "På — klikk for å slå av" : "Av — klikk for å slå på")}">
      <span class="kindtag">${f.kind === "photo" ? "IMG" : f.kind === "doc" ? "DOC" : f.kind === "cad" ? "CAD" : "—"}</span>
      <b style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</b>
      <span class="cap">${esc((f.caption || "").slice(0, 60))}</span>
      ${f.kind === "cad" ? '<span class="chip wait">CAD · FreeCAD senere</span>'
        : f.kind === "skipped" ? '<span class="chip">hoppes over</span>'
        : f.indexed ? `<span class="chip ok">✓ ${f.facts} fakta</span>`
        : (on ? '<span class="chip wait">⏳ klar</span>' : '<span class="chip">av</span>')}
      ${openBtn}
    </div>`;
  }).join("") + (p.files.length > SHOW_FILES
    ? `<button type="button" class="btn ghost" style="margin-top:8px;font-size:11px" onclick="window.__showAllFiles=true;renderProject('${id}')">Vis alle ${p.files.length} filer</button>`
    : (p.files.length > 8 && window.__showAllFiles
      ? `<button type="button" class="btn ghost" style="margin-top:8px;font-size:11px" onclick="window.__showAllFiles=false;renderProject('${id}')">Vis færre</button>`
      : ""));

  const tplOptions = BOOT.templates.map(t =>
    `<option value="${t.file}" ${p.template === t.file || INTENT_PICK?.file === t.file ? "selected" : ""}>${esc(t.name_no)}</option>`).join("");

  const gapRows = (activeDoc?.gap_list || (activeDoc?.template === p.active_template ? p.gaps : []) || []).map(g => `
    <div class="gaprow ${g.severity}">
      <span class="sev">${g.severity}</span>
      <span><b>${esc(g.section)}</b> · ${esc(g.label || g.key)}</span>
    </div>`).join("");

  const disabledFolders = new Set((p.source_selection?.disabled_folders || []).map(x => String(x).replace(/\\/g, "/")));
  const folderChips = p.folders.map(f => {
    const base = f.split(/[/\\]/).filter(Boolean).pop() || f;
    const enabled = !disabledFolders.has(base);
    const baseEsc = esc(base).replace(/'/g, "\\'");
    return `<button type="button" class="folder-chip ${enabled ? "src-on" : "src-off"}"
      title="${enabled ? "Mappe på — klikk for å slå av" : "Mappe av — klikk for å slå på"}"
      onclick="toggleProjectSource('folder','${baseEsc}', ${!enabled})">
      <span class="dot"></span>📁 ${esc(base)}
    </button>`;
  }).join("");

  const selectedPending = (p.files || []).filter(f =>
    f.enabled !== false && !f.indexed && f.kind !== "skipped" && f.kind !== "cad").length;
  const selectedIndexed = (p.files || []).filter(f => f.enabled !== false && f.indexed).length;

  const showDoc = docs.length > 0 || p.draft_exists;
  $("#main").classList.toggle("editor-mode", !!showDoc);
  document.body.classList.remove("editor-locked");
  if (!showDoc) setEditorImmersive(false);
  $("#main").innerHTML = `
    <div class="hub-shell">
    ${warnBanner}
    <div class="crumb"><a onclick="goHome(event)">← Foldok</a></div>
    <h1>${esc(p.name)}</h1>

    <div class="step">
      <div class="stepnum ${step1ok ? "ok" : "on"}">${step1ok ? "✓" : "1"}</div>
      <div class="card">
        <details class="fold-card" id="sources-step-fold" ${showDoc ? "" : "open"}>
          <summary>
            KILDER — ${p.files.length} filer i ${p.folders.length} mappe${p.folders.length > 1 ? "r" : ""}
            <span class="fold-meta">${sourcesMeta || "ingen filer"}</span>
          </summary>
          <div class="src-pick-hint">Klikk mappe eller fil for å slå <b style="color:var(--ok)">på</b> / <span style="color:#9AA0A8">av</span> — før og etter indeksering. Grønne er med.</div>
          <div style="margin:10px 0 8px">${folderChips}
            <button class="btn ghost" style="padding:3px 10px;font-size:11px" onclick="openAddFolderBrowser('${id}')">+ Legg til mappe</button>
            <button class="btn ghost" style="padding:3px 10px;font-size:11px" onclick="toggleAddFolder()">Lim inn sti…</button>
          </div>
          <div id="addfolder-area" style="display:none;margin-bottom:10px">
            <div class="keyrow">
              <input id="af-path" placeholder="Full folder path" />
              <button class="btn dark" style="flex-shrink:0" onclick="addFolder('${id}')">Legg til</button>
            </div>
            <div id="af-err"></div>
          </div>
          <div style="max-height:320px;overflow-y:auto">${fileRows || "Mappen er tom."}</div>
          <div class="src-pick-bar">
            <button class="btn ghost" id="btn-scan" onclick="scanSources('${id}')">Hurtigscan</button>
            <button class="btn" id="btn-index-selected" onclick="startIndexSelected('${id}')"
              ${selectedPending <= 0 ? "disabled" : ""}>
              ${selectedPending > 0
                ? `Start indeksering · ${selectedPending} valgt · ~€${(p.estimate_eur || 0).toFixed(2)}`
                : (selectedIndexed > 0 ? "Ingen nye valgt" : "Velg filer, deretter indekser")}
            </button>
            ${unindexed === 0 && indexed > 0
              ? `<span class="chip ok">✓ Ingen ventende PDF/bilder</span>`
              : ""}
            <span class="mono" style="font-size:10.5px;color:var(--steel)">Hurtigscan lister filer uten kostnad · full indeks kjører i biter</span>
          </div>
          <div id="prog-index"></div>
        </details>
      </div>
    </div>

    <div class="step" id="project-step">
      <div class="stepnum ${p.artifact ? "ok" : step1ok ? "on" : ""}">${p.artifact ? "✓" : "2"}</div>
      <div class="card">
        <details class="fold-card" id="project-step-fold" ${showDoc ? "" : "open"}>
          <summary>
            PROSJEKT — forstå og bygg
            <span class="fold-meta">${agentUnderstoodFoldMeta(p.artifact, p)}</span>
          </summary>
          <div id="artifact-area">${artifactHTML(p.artifact ? p : { ...p, artifact: emptyArtifactSeed(p) }, { hideChat: !!showDoc })}</div>
          <div id="prog-artifact"></div>
          <div id="prog-generate" style="display:none"></div>
          ${!p.artifact && step1ok ? `<div style="margin-top:10px">
            <button class="btn ghost" style="font-size:12px" onclick="startArtifact('${id}')">Eller bygg modell fra indekserte kilder (1 Sonnet-kall)</button>
          </div>` : ""}
        </details>
      </div>
    </div>

    ${showDoc ? `
    <div class="step" id="doc-panel">
      <div class="stepnum ok">✓</div>
      <div class="card" style="padding:16px 18px">
        <div class="label" style="margin:0 0 10px">REDIGER — ${esc(resultLabel)}</div>
        <div id="hist-area" style="display:none"></div>
        <div id="excluded-figs-area"></div>
        <div class="editor-shell">
          <div class="editor-work">
            <nav class="editor-flow" id="editor-flow" aria-label="Arbeidsflyt">
              <button type="button" data-rail="analyze" onclick="setEditorRail('analyze')">Analyze</button>
              <button type="button" data-rail="gaps" onclick="setEditorRail('gaps')">
                <span class="flow-dot" id="flow-gaps-dot" hidden></span>Resolve Gaps
              </button>
              <button type="button" data-rail="tools" onclick="setEditorRail('tools')">Tools</button>
              <button type="button" data-rail="documents" class="on" onclick="setEditorRail('documents')">Documents</button>
              <button type="button" data-rail="publish" onclick="setEditorRail('publish')">Publish</button>
            </nav>
            <div class="editor-work-body" id="editor-work-body">
              <aside class="editor-rail" id="editor-rail">
                <div class="rail-head">
                  <h3 id="rail-title">Documents</h3>
                  <div class="rail-meta" id="rail-meta"></div>
                </div>
                <div class="rail-body" id="rail-body">
                  <div class="mono" style="font-size:11px;color:var(--steel)">Laster…</div>
                </div>
              </aside>
              <div class="editor-canvas">
                <div class="doc-active-label" id="doc-active-label">${esc(docLabel(p, ACTIVE_DOC))}</div>
                <div id="diff-area"></div>
                <div id="draft-area">Laster utkast…</div>
              </div>
            </div>
          </div>
          <aside class="assist-dock" id="assist-dock">

              <h3>Assistent</h3>

    <div class="step"><div class="stepnum"></div><div class="card">${renderSuggestionsHTML(p, id)}</div></div>` : "")}

      </div>`;

    else aBubble("bot", doneHtml);
    setTimeout(() => scrollToDocPanel(), 200);
  }

async function fillKnownGaps() {
  if (!PROJECT?.id || !ACTIVE_DOC) return;
  const n = PROJECT.fillable_gaps || 0;
  if (!n) return;
  if (!confirm(`Fylle inn ${n} verdier vi allerede finner i kildene eller artefaktmodellen?`)) return;
  try {
    const r = await api("/api/doc/fill-known-gaps", { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ id: PROJECT.id, template: ACTIVE_DOC }) });
    showToast(`Fylte inn ${(r.applied || []).length} verdier`);
    await renderProject(PROJECT.id);
  } catch (e) { alert(e.message); }
}

function renderGapPill(p) {
  const gs = p.gap_summary || { total: (p.gaps||[]).length, blocking: 0, warning: 0 };
  const el = $("#gap-pill-area");
  if (typeof renderEditorRail === "function" && $("#editor-rail")) {
    const dot = $("#flow-gaps-dot");
    if (dot) dot.hidden = !(gs.blocking > 0);
    if (EDITOR_RAIL === "gaps" || EDITOR_RAIL === "publish" || EDITOR_RAIL === "documents" || EDITOR_RAIL === "tools") renderEditorRail();
  }
  if (!el) return;
  const fillable = p.fillable_gaps || 0;
  const fillBtn = fillable > 0
    ? `<button class="btn" style="margin-top:8px;width:100%;font-size:12px" onclick="event.stopPropagation();fillKnownGaps()">Fyll inn det vi vet (${fillable})</button>`
    : "";
  if (gs.total === 0 && p.doc) {
    el.innerHTML = `<span class="gap-pill ok"><span class="dot"></span>✓ Ingen mangler</span>`;
  } else {
    const gaps = p.gaps || [];
    const rows = gaps.map(g => `
      <div class="gaprow ${g.severity}">
        <span class="sev">${g.severity}</span>
        <span style="flex:1"><b>${esc(g.section)}</b> · ${esc(g.label || g.key)}</span>
        <button class="btn ghost" style="padding:3px 8px;font-size:11px" onclick="openManglerMenu('${esc(g.key)}','${esc(g.section)}','${g.severity||"blocking"}',event)">Løs →</button>
      </div>`).join("");
    el.innerHTML = `
      <div class="gap-drop" id="gap-drop">
        <span class="gap-pill" onclick="toggleGapMenu(event)">
          <span class="dot"></span>
          ${gs.blocking ? gs.blocking + " blokkerende" : ""}${gs.blocking && gs.warning ? " · " : ""}${gs.warning ? gs.warning + " advarsler" : ""}${gs.ubekreftet ? ((gs.blocking || gs.warning) ? " · " : "") + gs.ubekreftet + " ubekreftet" : ""}${!gs.blocking && !gs.warning && !gs.ubekreftet ? gs.total + " hull" : ""} ▾
        </span>
        <div class="gap-menu">${rows || "Ingen hull"}${fillBtn}</div>
      </div>`;
  }
  const dismissed = p.dismissed || [];
  if (dismissed.length) {
    el.innerHTML += `<details style="margin-top:8px;font-size:12px"><summary>Vis avviste (${dismissed.length})</summary>
      ${dismissed.map(d => `<div class="gaprow info" style="margin-top:4px">${esc(d.key)} · ${esc(d.reason)}
        <button class="btn ghost" style="padding:2px 8px;font-size:11px;margin-left:8px" onclick="undismissGap('${esc(d.key)}','${esc(d.section||"")}')">Angre</button></div>`).join("")}
    </details>`;
  }
  if (p.blocking_dismissed?.length) {
    el.innerHTML += `<div style="margin-top:8px;font-size:12px;color:var(--steel)">Avviste blokkerende (listes ved eksport): ${p.blocking_dismissed.map(d => esc(d.key)).join(", ")}</div>`;
  }
}

function toggleGapMenu(e) {
  e.stopPropagation();
  $("#gap-drop")?.classList.toggle("open");
}
document.addEventListener("click", () => $("#gap-drop")?.classList.remove("open"));

function toggleHistory() {
  const el = $("#hist-area");
  if (!el) return;
  if (el.style.display !== "none") { el.style.display = "none"; return; }
  const vers = PROJECT?.versions || [];
  el.innerHTML = `<div class="hist-drawer"><div class="label">HISTORIKK</div>
    ${vers.map(v => `<div class="hist-row"><span>${esc(v.summary)} <span class="mono" style="color:var(--steel);font-size:10px">${esc(v.who)} · ${esc((v.t||"").slice(0,16))}</span></span>
      ${v.section && v.prev_md != null ? `<button class="btn ghost" style="padding:2px 8px;font-size:11px" onclick="revertSection('${esc(v.section)}')">Tilbakestill</button>` : ""}
    </div>`).join("") || "Ingen endringer ennå."}</div>`;

}

let ARTIFACT_DRAFT = null;
let A_CHAT_HTML = "";
let A_PENDING_PATCH = null;
let A_SHOW_MODEL = false;
let A_USER_TURNS = [];
let INTENT_RESULT_HTML = "";
let INTENT_STORY = "";
let INTENT_PICK = null; // { file, name_no, why_no, choice }
let PENDING_STREAM_DONE = null;

function ensureDirection(a) { return a; }

function shortQ(text, n=110) {
  const t = (text || "").trim();
  if (t.length <= n) return t;
  const cut = t.slice(0, n);
  const sp = cut.lastIndexOf(" ");
  return (sp > 40 ? cut.slice(0, sp) : cut) + "…";
}

function agentUnderstoodLines(a, p) {
  const art = a || p?.artifact || {};
  const name = String(art.name || p?.name || "Prosjekt").trim() || "Prosjekt";
  const purpose = String(art.purpose || "").trim();
  const comps = (art.main_components || [])
    .map(c => (typeof c === "string" ? c : (c?.name || c?.label || "")).trim())
    .filter(Boolean);
  const funn = (art.hazards || []).length;
  const pct = Math.round((Number(art.confidence) || 0) * 100);
  const hasSubstance = !!(purpose || comps.length || funn || pct >= 40);
  return { name, purpose, comps, funn, pct, hasSubstance, confirmed: !!p?.confirmed };
}

function agentUnderstoodFoldMeta(a, p) {
  const u = agentUnderstoodLines(a, p);
  if (!u.hasSubstance) return u.pct ? `${u.pct}% · tynt utkast` : "utkast";
  const bits = [shortQ(u.name, 32)];
  if (u.purpose) bits.push(shortQ(u.purpose, 52));
  bits.push(`${u.pct}%`);
  return bits.join(" · ");
}

function agentUnderstoodBridgeHtml(a, p) {
  const u = agentUnderstoodLines(a, p);
  const purposeLine = u.purpose
    ? `<div class="understood-line"><b>Formål:</b> ${esc(shortQ(u.purpose, 240))}</div>`
    : `<div class="understood-line muted">Formål ikke satt ennå.</div>`;
  const compLine = u.comps.length
    ? `<div class="understood-line"><b>Komponenter:</b> ${esc(u.comps.slice(0, 6).join(", "))}${u.comps.length > 6 ? "…" : ""}</div>`
    : "";
  const funnLine = u.funn
    ? `<div class="understood-line"><b>Funn fra kilder:</b> ${u.funn}</div>`
    : "";
  const status = u.confirmed ? " · bekreftet" : (u.hasSubstance ? "" : " · tynt");
  return `<div class="a-chat-bridge" id="a-chat-bridge">
      <div class="understood-block">
        <div class="understood-kicker">Agenten har forstått</div>
        <div class="understood-title">${esc(u.name)} <span class="mono">${u.pct}%</span>${status}</div>
        ${purposeLine}
        ${compLine}
        ${funnLine}
      </div>
      <button type="button" class="btn" onclick="focusEditorAssistant()">Fortsett i Assistent →</button>
    </div>`;
}

function estimateGenerateEur(tplFile) {
  const t = (BOOT?.templates || []).find(x => x.file === tplFile);
  const n = (t?.sections || []).length || 8;
  const tier = 0.015; // rough Sonnet section cost
  return Math.round(n * tier * 100) / 100;
}

function emptyArtifactSeed(p) {
  return {
    name: p?.name || "Prosjekt",
    purpose: "",
    main_components: [],
    hazards: [],
    lifecycle_stages: [],
    confidence: 0.15,
    language: "no",
  };
}

function projectHasIndexedSources(p) {
  return (p?.files || []).some(f => f.indexed && f.kind !== "skipped");
}

function artifactHTML(p, opts) {
  const hideChat = !!(opts && opts.hideChat);
  ARTIFACT_DRAFT = JSON.parse(JSON.stringify(p.artifact || emptyArtifactSeed(p)));
  const a = ARTIFACT_DRAFT;
  const locked = !!p.confirmed;
  const seeded = !p.artifact;
  const nQ = (a.hazards || []).length;
  const nC = (a.main_components || []).length;
  const nL = (a.lifecycle_stages || []).length;
  const pct = Math.round((a.confidence || 0) * 100);
  const hasSrc = projectHasIndexedSources(p);
  const tplOptions = (BOOT?.templates || []).map(t =>
    `<option value="${t.file}">${esc(t.name_no)}</option>`).join("");
  const techFile = (BOOT?.templates || []).find(t =>
    (t.key || "").includes("technical") || (t.file || "").includes("technical_doc"))?.file;
  const planFile = (BOOT?.templates || []).find(t =>
    (t.key || "").includes("project_plan") || (t.file || "").includes("project_plan"))?.file;
  const techEur = techFile ? estimateGenerateEur(techFile) : 0.18;
  const planEur = planFile ? estimateGenerateEur(planFile) : 0.15;
  const hints = hasSrc
    ? `<button type="button" onclick="aHint('Oppsummer prosjektet ut fra kildene')">Oppsummer prosjektet</button>
       <button type="button" onclick="proposeTemplateFromChat()">Hvilket dokument passer?</button>
       <button type="button" onclick="lagDokumentFromChip(${techFile ? `'${techFile}'` : "null"}, 'Teknisk dokumentasjonspakke')">Lag teknisk dokumentasjonspakke (€${techEur.toFixed(2).replace(".", ",")})</button>
       <button type="button" onclick="lagDokumentFromChip(${planFile ? `'${planFile}'` : "null"}, 'Prosjektplan')">Lag prosjektplan (€${planEur.toFixed(2).replace(".", ",")})</button>`
    : `<button type="button" onclick="aHint('Dette prosjektet handler om: ')">Beskriv prosjektet</button>
       <button type="button" onclick="lagDokumentFromChip(${planFile ? `'${planFile}'` : "null"}, 'Prosjektplan')">Lag prosjektplan (€${planEur.toFixed(2).replace(".", ",")})</button>
       <button type="button" onclick="proposeTemplateFromChat()">Hvilket dokument passer?</button>
       <button type="button" onclick="showAllTemplates()">Velg mal manuelt</button>`;
  const chatBlock = hideChat
    ? agentUnderstoodBridgeHtml(a, p)
    : `<div class="a-chat">
        <div class="log" id="a-assist-log"></div>
        <div class="hints">${hints}</div>
        <div class="compose" id="a-compose"
          ondragover="chatDragOver(event)" ondragleave="chatDragLeave(event)" ondrop="chatDrop(event,'artifact')">
          <button type="button" class="chat-attach-btn" title="Legg ved fil" onclick="chatPickFile('artifact')">📎</button>
          <input type="file" id="artifact-attach-file" hidden onchange="chatFilePicked(event,'artifact')" />
          <input id="a-assist-in" placeholder="Skriv fritt — eller dra en fil hit…"
            onkeydown="if(event.key==='Enter')aChatSend()" onpaste="chatPaste(event,'artifact')" />
          <button type="button" class="btn" style="padding:10px 14px;flex-shrink:0" onclick="aChatSend()">Send</button>
        </div>
      </div>`;
  const understood = agentUnderstoodLines(a, p);
  const manualSummary = understood.hasSubstance
    ? "Annen mal / velg manuelt ▾"
    : "Vet du allerede hva du trenger? Velg mal manuelt ▾";
  return `
    <div class="a-head-row">
      <span style="font-size:16px;font-weight:800">${esc(a.name || "Prosjekt")}</span>
      <span class="mono" style="font-size:11px;color:var(--ok)">${pct}% sikker</span>
      ${p.confirmed ? '<span class="chip ok">✓ bekreftet</span>'
        : seeded ? '<span class="chip wait">tom mappe — beskriv i chat</span>'
        : '<span class="chip wait">utkast</span>'}
      <button type="button" class="a-rail-toggle" onclick="A_SHOW_MODEL=!A_SHOW_MODEL;aRemountShell()">
        ${A_SHOW_MODEL ? "Skjul modell" : "Vis modell"}
      </button>
    </div>

    <div class="a-shell ${A_SHOW_MODEL ? "with-model" : ""}" id="a-shell">
      ${chatBlock}

      ${A_SHOW_MODEL ? `<aside class="a-model-panel">
        <div class="hd">Modell <span class="mono" style="font-weight:600;color:var(--steel);font-size:10px">✎</span></div>
        <div class="bd">
          <div class="sec-label">Navn</div>
          <input id="a-name" style="width:100%;font-size:13px;font-weight:700" value="${esc(a.name || "")}"
            ${locked && pct >= 70 ? "readonly" : ""} onchange="aField('name', this.value)" />
          <div class="sec-label">Formål</div>
          <textarea id="a-purpose" rows="3" style="width:100%;font-size:12px"
            onchange="aField('purpose', this.value)">${esc(a.purpose || "")}</textarea>
          <div class="sec-label">Komponenter (${nC})</div>
          <div id="a-comps"></div>
          <div class="keyrow" style="margin:4px 0 0"><input id="a-comp-in" placeholder="Ny komponent" />
            <button class="btn ghost" style="flex-shrink:0;padding:6px 8px" onclick="aAddComp()">+</button></div>
          <div class="sec-label">Livssyklus</div>
          <div id="a-life"></div>
          <div class="sec-label">Funn fra kildene (${nQ})</div>
          <div id="a-funn-list" class="a-funn"></div>
          <div class="sec-label">Illustrasjoner</div>
          <div class="a-illust" id="a-illust" style="grid-template-columns:1fr 1fr"></div>
          <button type="button" class="btn ghost" style="margin-top:10px;font-size:11px" onclick="aSave(false)">Lagre modell</button>
        </div>
      </aside>` : `
        <input id="a-name" type="hidden" value="${esc(a.name || "")}" />
        <div id="a-comps" style="display:none"></div>
        <div id="a-life" style="display:none"></div>
        <div id="a-funn-list" style="display:none"></div>
        <div id="a-illust" style="display:none"></div>
        <textarea id="a-purpose" style="display:none">${esc(a.purpose || "")}</textarea>
      `}
    </div>

    <details class="a-manual">
      <summary>${manualSummary}</summary>
      <div class="keyrow" style="margin-top:8px">
        <select id="tpl">${tplOptions}</select>
        <button type="button" class="btn" style="flex-shrink:0" onclick="lagDokumentet($('#tpl').value)">Lag dokumentet →</button>
      </div>
    </details>`;
}

function aRemountShell() {
  const area = $("#artifact-area");
  if (!area || !PROJECT) return;
  const draft = ARTIFACT_DRAFT || PROJECT.artifact;
  if (!draft) return;
  const hideChat = !!ACTIVE_DOC || !!(PROJECT.documents || []).length || !!PROJECT.draft_exists;
  area.innerHTML = artifactHTML({ ...PROJECT, artifact: draft }, { hideChat });
  ARTIFACT_DRAFT = draft;
  aRenderLists();
  if (!hideChat) aInitAssist();
}

function focusEditorAssistant() {
  collapseStepsForDocument();
  scrollToDocPanel();
  $("#assist-dock")?.classList.add("open");
  setTimeout(() => $("#assist-input")?.focus(), 250);
}

function aField(key, val) {
  if (!ARTIFACT_DRAFT) return;
  ARTIFACT_DRAFT[key] = val;
}

function aRenderLists() {
  const a = ARTIFACT_DRAFT;
  if (!a) return;
  const locked = !!PROJECT?.confirmed;
  aRenderFindings();
  const comps = $("#a-comps");
  if (comps) {
    comps.innerHTML = (a.main_components || []).map((c, i) => {
      const srcs = (c.seen_in || []).join(", ");
      return `<div class="a-chip">
        <div class="txt"><div contenteditable="${!locked}" onblur="aEditComp(${i}, this.textContent)">${esc(c.name)}</div>
          ${srcs ? `<div class="src" onclick="aFocusSource('${esc((c.seen_in||[])[0]||"")}')">↖ ${esc(srcs)}</div>` : ""}</div>
        ${locked ? "" : `<button type="button" class="x" onclick="aDelComp(${i})" title="Fjern">×</button>`}
      </div>`;
    }).join("") || `<div class="mono" style="font-size:11px;color:var(--steel)">Ingen komponenter</div>`;
  }
  const life = $("#a-life");
  if (life) {
    const stages = ["transport","install","operate","inspect","maintain","dispose"];
    life.innerHTML = stages.map(s => {
      const on = (a.lifecycle_stages || []).includes(s);
      return `<button type="button" class="pill" style="cursor:pointer;margin:0 4px 4px 0;${on ? "background:#E8F5EC;border-color:var(--ok);color:var(--ok);font-weight:700" : ""}"
        onclick="${locked ? "" : `aToggleLife('${s}')`}">${esc(s)}</button>`;
    }).join("");
  }
  aRenderIllust();
}

function aRenderFindings() {
  const el = $("#a-funn-list");
  if (!el || !ARTIFACT_DRAFT) return;
  const hazards = ARTIFACT_DRAFT.hazards || [];
  if (!hazards.length) {
    el.innerHTML = `<div class="mono" style="font-size:11px;color:var(--steel);padding:8px">Ingen funn ennå.</div>`;
    return;
  }
  el.innerHTML = hazards.map((h, i) => {
    const src = h.source ? esc(String(h.source).split("/").pop()) : "";
    const q = esc(h.hazard || "");
    return `<div class="funn-row">
      <div style="flex:1;min-width:0">
        <div>${esc(shortQ(h.hazard, 200))}</div>
        ${src ? `<div class="funn-src">↖ ${src}</div>` : ""}
      </div>
      <button type="button" class="funn-ask" title="Still spørsmålet til assistenten"
        onclick="aAskFinding(${i})">→ still spørsmålet</button>
    </div>`;
  }).join("");
}

function aAskFinding(i) {
  const h = (ARTIFACT_DRAFT?.hazards || [])[i];
  if (!h?.hazard) return;
  A_SHOW_MODEL = true;
  aRemountShell();
  const input = $("#a-assist-in");
  if (input) {
    input.value = h.hazard;
    input.focus();
  }
}

function aEditComp(i, text) {
  const t = (text || "").trim();
  if (!t || !ARTIFACT_DRAFT.main_components[i]) return;
  ARTIFACT_DRAFT.main_components[i].name = t;
}
function aEditHazard(i, text) {
  const t = (text || "").trim();
  if (!t || !ARTIFACT_DRAFT.hazards[i]) return;
  ARTIFACT_DRAFT.hazards[i].hazard = t;
}
function aDelComp(i) { ARTIFACT_DRAFT.main_components.splice(i, 1); aRenderLists(); }
function aAddComp() {
  const v = $("#a-comp-in")?.value?.trim();
  if (!v) return;
  ARTIFACT_DRAFT.main_components = ARTIFACT_DRAFT.main_components || [];
  ARTIFACT_DRAFT.main_components.push({ name: v, seen_in: [] });
  $("#a-comp-in").value = "";
  aRenderLists();
}
function aToggleLife(s) {
  const cur = new Set(ARTIFACT_DRAFT.lifecycle_stages || []);
  if (cur.has(s)) cur.delete(s); else cur.add(s);
  ARTIFACT_DRAFT.lifecycle_stages = [...cur];
  aRenderLists();
}

function aSourceFiles() {
  const a = ARTIFACT_DRAFT || {};
  const set = new Set();
  (a.main_components || []).forEach(c => (c.seen_in || []).forEach(f => set.add(f)));
  (a.hazards || []).forEach(h => { if (h.source) set.add(h.source); });
  // Only cited sources — never dump all 100+ indexed files into the rail
  return [...set].slice(0, 24);
}

function aRenderSources() {
  const el = $("#a-src-list");
  if (!el) return;
  const names = aSourceFiles();
  const files = PROJECT?.files || [];
  el.innerHTML = names.map(n => {
    const f = files.find(x => x.name === n) || { name: n, caption: "", kind: "doc" };
    return `<div class="src-file" style="cursor:pointer" onclick="aFocusSource('${esc(n)}')">
      <span class="kindtag">${f.kind === "photo" ? "IMG" : "DOC"}</span>
      <span style="min-width:0"><b style="font-size:11px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n.split("/").pop())}</b>
        <div style="color:var(--steel);font-size:10px">${esc((f.caption || "").slice(0, 80))}</div></span>
    </div>`;
  }).join("") || `<div class="mono" style="font-size:11px;color:var(--steel)">Indekser filer først</div>`;
}

async function aRenderIllust() {
  const el = $("#a-illust");
  if (!el || !PROJECT?.id) return;
  const names = aSourceFiles().filter(n => /\.(pdf|png|jpe?g|webp)$/i.test(n)).slice(0, 6);
  if (!names.length) {
    el.innerHTML = `<div class="mono" style="font-size:11px;color:var(--steel)">Ingen PDF/bilder knyttet ennå — indekser presentasjon/tegninger.</div>`;
    return;
  }
  const cards = [];
  for (const file of names) {
    try {
      const meta = await api("/api/media/meta?id=" + PROJECT.id + "&file=" + encodeURIComponent(file));
      const pages = Math.min(meta.show_pages || 1, 2);
      for (let page = 0; page < pages; page++) {
        const src = `/api/media?id=${PROJECT.id}&file=${encodeURIComponent(file)}&page=${page}`;
        cards.push(`<div class="fig-card"><img src="${src}" loading="lazy" onclick="openFigLightbox('${src.replace(/'/g,"\\'")}')" />
          <div class="cap"><b>${esc(file.split("/").pop())}${pages > 1 ? " · s." + (page+1) : ""}</b></div></div>`);
      }
    } catch (_) {}
  }
  el.innerHTML = cards.join("") || `<div class="mono" style="font-size:11px;color:var(--steel)">Kunne ikke vise forhåndsvisning</div>`;
}

function aFocusSource(name) {
  if (!name || !PROJECT?.id) return;
  openSourceFile(name);
}

async function openSourceFile(name, reveal) {
  if (!name || !PROJECT?.id) return;
  try {
    const q = "/api/open-source?id=" + encodeURIComponent(PROJECT.id)
      + "&file=" + encodeURIComponent(name)
      + (reveal ? "&reveal=1" : "");
    const r = await api(q);
    showToast(reveal ? "Vist i Explorer" : ("Åpnet: " + (name.split("/").pop() || name)));
    if ($("#a-assist-log")) {
      aBubble("bot", `Åpnet kilde <b>${esc(name)}</b>${r.path ? ` <span class="mono" style="font-size:10px">(${esc(r.path)})</span>` : ""}.`);
    }
  } catch (e) {
    alert(e.message || "Kunne ikke åpne filen");
  }
}

function aInitAssist() {
  const log = $("#a-assist-log");
  if (!log) return;
  const conv = PROJECT?.conversation || [];
  if (conv.length) {
    log.innerHTML = "";
    for (const t of conv) {
      const who = t.role === "user" ? "user" : "bot";
      const html = t.html || esc(t.text || "").replace(/\n/g, "<br>");
      const div = document.createElement("div");
      div.className = "assist-bubble " + who;
      div.innerHTML = html;
      log.appendChild(div);
    }
    log.scrollTop = log.scrollHeight;
    A_CHAT_HTML = log.innerHTML;
    return;
  }
  if (A_CHAT_HTML) { log.innerHTML = A_CHAT_HTML; log.scrollTop = log.scrollHeight; return; }
  log.innerHTML = "";
  const u = agentUnderstoodLines(PROJECT?.artifact, PROJECT);
  if (u.hasSubstance) {
    const comps = u.comps.length
      ? `<br><b>Komponenter:</b> ${esc(u.comps.slice(0, 6).join(", "))}${u.comps.length > 6 ? "…" : ""}`
      : "";
    aBubble("bot", `<b>Slik forstår jeg prosjektet nå</b> · ${u.pct}%${u.confirmed ? " · bekreftet" : ""}<br>
      <b>${esc(u.name)}</b>${u.purpose ? `<br>${esc(shortQ(u.purpose, 260))}` : ""}${comps}<br>
      Si hva du vil ha laget — eller rett meg hvis noe er feil.`);
    return;
  }
  const hasSrc = projectHasIndexedSources(PROJECT);
  const fileCount = (PROJECT?.files || []).filter(f => f.kind !== "skipped").length;
  if (!hasSrc && fileCount === 0) {
    aBubble("bot", `Mappen er tom — forståelsen bygger kun på prosjektnavnet. Legg til filer, eller fortsett med et dokument der du fyller inn verdiene.`);
  } else if (!hasSrc) {
    aBubble("bot", `Ingen indekserte kilder ennå. Beskriv prosjektet i chatten, eller indekser filer under KILDER først.`);
  } else {
    aBubble("bot", `Fortell hva prosjektet er — eller hva du trenger laget.<br>
      Når intensjonen er klar, får du et <b>avtalekort</b> her i samtalen. Ett klikk lager dokumentet.`);
  }
}

function aHint(text) {

  if (!input) return;

  input.focus();

  if (/:\s*$/.test(text)) return;
  aChatSend();

function aBubble(who, html) {
  const log = $("#a-assist-log");
  if (!log) return;
  const div = document.createElement("div");
  div.className = "assist-bubble " + who;
  div.innerHTML = html;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  A_CHAT_HTML = log.innerHTML;
}

function aPatchSummary(patch) {
  if (!patch || typeof patch !== "object") return "";
  const bits = [];
  if (patch.name) bits.push("navn");
  if (patch.purpose) bits.push("formål");
  if (patch.main_components) bits.push(`${patch.main_components.length} komponenter`);
  if (patch.hazards) bits.push(`${patch.hazards.length} funn`);
  if (patch.lifecycle_stages) bits.push("livssyklus");
  if (patch.confidence != null) bits.push(`${Math.round(patch.confidence * 100)}% sikker`);
  return bits.length ? bits.join(" · ") : "modell";
}

function aStoryFromChat() {
  const turns = (A_USER_TURNS || []).filter(Boolean);
  const purpose = (ARTIFACT_DRAFT || PROJECT?.artifact || {}).purpose || "";
  if (!turns.length && !purpose) return "";
  const recent = turns.slice(-4).join("\n");
  if (purpose && recent) return `${purpose}\n\n${recent}`;
  return recent || purpose;
}

function wantsTemplateFromChat(text) {
  return /foreslå\s*mal|finn\s*(riktig\s*)?mal|hvilken\s*mal|trenger\s+(en\s+|et\s+)?(dok|rapport|plan|mal|pakke|installasjons|installasjon)|teknisk\s+dokument|dokumentasjonspakke|prosjektplan|samsvars|installasjonsmanual|installation\s+manual|generer\s+(utkast|dokument)|kapittelstruktur|hjelp\s+meg\s+(med|å)\s+(å\s+)?(lage|skrive|bygge)|kunden vil|komplett teknisk|teknisk mappe|phd|ph\.?d|forskningsprosjekt|jeg vil lage|vil\s+lage\s+(et|en)|lag\s+(en\s+)?installasjons/i.test(text || "");

async function aChatSend() {
  // ONE_AGENT: when a document is open, the side Assistent is the live surface
  if (ACTIVE_DOC && $("#assist-input")) {
    const input = $("#a-assist-in");
    const text = (input?.value || "").trim();
    if (!text) return;
    if (input) input.value = "";
    focusEditorAssistant();
    const side = $("#assist-input");
    if (side) side.value = text;
    return chatSend();
  }
  const input = $("#a-assist-in");
  const text = (input?.value || "").trim();
  if (!text || !PROJECT) return;
  if (!ARTIFACT_DRAFT) ARTIFACT_DRAFT = emptyArtifactSeed(PROJECT);
  input.value = "";
  input.disabled = true;
  A_USER_TURNS = [...(A_USER_TURNS || []), text].slice(-12);
  INTENT_STORY = aStoryFromChat();
  aBubble("user", esc(text));
  aBubble("bot", "Tenker…");
  try {
    const r = await api("/api/artifact/assist", { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ id: PROJECT.id, message: text, artifact: ARTIFACT_DRAFT }) });
    const log = $("#a-assist-log");
    if (log?.lastChild) log.lastChild.remove();
    let html = esc(r.reply || "").replace(/\n/g, "<br>");
    if (r.patch) {
      aApplyPatch(r.patch, { quiet: true });
      html += `<div class="a-patch-note">✓ Oppdatert: ${esc(aPatchSummary(r.patch))}</div>`;
      try {
        await api("/api/artifact/save", { method:"POST", headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({ id: PROJECT.id, artifact: ARTIFACT_DRAFT, confirm: false }) });
        if (PROJECT) PROJECT.artifact = JSON.parse(JSON.stringify(ARTIFACT_DRAFT));
      } catch (_) {}
    }
            if (r.cost_eur) html += `<div class="mono" style="font-size:10px;color:var(--steel);margin-top:6px">€${r.cost_eur}</div>`;
    aBubble("bot", html);
    if (r.conversation) PROJECT.conversation = r.conversation;

    if (r.offer_document || wantsTemplateFromChat(text)) {
      await proposeTemplateFromChat();
    }
  } catch (e) {
    const log = $("#a-assist-log");
    if (log?.lastChild) log.lastChild.remove();
    aBubble("bot", esc(e.message));
  } finally {
    input.disabled = false;
    input.focus();
  }
}

function aApplyPendingPatch() {
  if (A_PENDING_PATCH) aApplyPatch(A_PENDING_PATCH);
  A_PENDING_PATCH = null;

function aApplyPatch(patch, opts) {
  if (!patch || !ARTIFACT_DRAFT) return;

  function mergeByName(existing, incoming, nameKey) {
    if (!Array.isArray(incoming)) return existing;
    if (!existing?.length) return incoming;
    const names = new Set(existing.map(x => String(x[nameKey] || "").toLowerCase()));
    const onlyNew = incoming.every(x => !names.has(String(x[nameKey] || "").toLowerCase()));
    if (onlyNew) return [...existing, ...incoming];
    return incoming;
  }

  for (const [k, v] of Object.entries(patch)) {
    if (k === "direction" && v && typeof v === "object") {
      ARTIFACT_DRAFT.direction = { ...(ARTIFACT_DRAFT.direction || {}), ...v };
      if (v.options) ARTIFACT_DRAFT.direction.options = v.options;
    } else if (k === "main_components" && Array.isArray(v)) {
      ARTIFACT_DRAFT.main_components = mergeByName(ARTIFACT_DRAFT.main_components, v, "name");
    } else if (k === "hazards" && Array.isArray(v)) {
      ARTIFACT_DRAFT.hazards = mergeByName(ARTIFACT_DRAFT.hazards, v, "hazard");
    } else if (k === "lifecycle_stages" && Array.isArray(v)) {
      const cur = new Set(ARTIFACT_DRAFT.lifecycle_stages || []);
      v.forEach(s => cur.add(s));
      ARTIFACT_DRAFT.lifecycle_stages = [...cur];
    } else {
      ARTIFACT_DRAFT[k] = v;
    }
  }
  const name = $("#a-name"); if (name) name.value = ARTIFACT_DRAFT.name || "";
  const purp = $("#a-purpose"); if (purp) purp.value = ARTIFACT_DRAFT.purpose || "";
  aRenderLists();
  const btn = document.querySelector(".a-rail-toggle");
  if (btn && !A_SHOW_MODEL) {
    const n = (ARTIFACT_DRAFT.main_components || []).length
      + (ARTIFACT_DRAFT.hazards || []).length
      + (ARTIFACT_DRAFT.lifecycle_stages || []).length;
    btn.textContent = `Vis modell (${n})`;
  }
  if (!opts?.quiet) aBubble("bot", "Modell oppdatert.");
}

/* ── actions + job polling ───────────────────────────────── */
async function startIndex(id, scope, prescan) {
  scope = scope || { mode: "all" };
  const body = { id, confirm: true, scope, mode: scope.mode };
  if (scope.subfolders) body.subfolders = scope.subfolders;
  if (scope.newest_n) body.newest_n = scope.newest_n;
  if (prescan) body.prescan = prescan;
  const host = $("#prog-index");
  if (host) host.innerHTML = `<div class="mono" style="font-size:11px">Starter indeksering…</div>`;
  try {
    const r = await api("/api/index", { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(body) });
    if (r.needs_decision_card) {
      showIndexDecisionCard(id, r.prescan, r.card_text);
      return;
    }
    if (r.needs_confirm) {
      showToast(r.message || "Bekreft indeksering");
      return;
    }
    if (r.job) pollJob(r.job, id, { host: "#prog-index", surface: "editor" });
  } catch (e) {
    alert(e.message);
  } finally {
    const b = $("#btn-scan");
    if (b) { b.disabled = false; b.textContent = "Scan for nye filer"; }
  }
}

function recommendedTemplatesForPicker() {
  const all = (BOOT?.templates || []).filter(t =>
    t.origin !== "sketched" && t.key !== "sketch_document" && !t.owned
  );
  const art = ARTIFACT_DRAFT || PROJECT?.artifact || {};
  const blob = `${art.name || ""} ${art.purpose || ""}`.toLowerCase();
  const scored = all.map(t => {
    let s = 0;
    const desc = `${t.name_no || ""} ${t.description || ""} ${(t.applies_to || []).join(" ")}`.toLowerCase();
    if (/technical|teknisk|doc_package/.test(t.file || "") || /technical/.test(t.key || "")) s += 2;
    if (blob && desc.split(/\s+/).some(w => w.length > 3 && blob.includes(w))) s += 3;
    if ((t.applies_to || []).length) s += 1;
    return { t, s };
  });
  scored.sort((a, b) => b.s - a.s);
  return scored.slice(0, 3).map(x => x.t);
}

function ownedTemplatesForPicker() {
  return (BOOT?.templates || []).filter(t => t.owned || t.origin === "sketched");
}

/** A2 — create shell, open doc, switch to Tools. Never block on artifact. */
async function createDocumentFromPicker(file, opts) {
  if (!PROJECT?.id) {
    alert("Åpne et prosjekt først.");
    return;
  }
  if (!file) {
    alert("Velg en mal.");
    return;
  }
  opts = opts || {};
  const conf = Number((ARTIFACT_DRAFT || PROJECT?.artifact || {}).confidence || 0);
  const confirmed = !!PROJECT.confirmed;
  const isSketch = !!opts.sketch || file === "sketch_document.json"
    || (BOOT?.templates || []).find(t => t.file === file)?.document_species === "sketch";
  const fmt = opts.output_format || NEW_DOC_FORMAT || "pdf";
  console.info("[doc/create] →", { id: PROJECT.id, template: file, sketch: isSketch, output_format: fmt });
  try {
    const r = await api("/api/doc/create", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        id: PROJECT.id,
        template: file,
        sketch: isSketch,
        output_format: fmt,
        generate: !isSketch && conf >= 0.7 && confirmed && (PROJECT.folders || []).length > 0,
      }),
    });
    console.info("[doc/create] ←", r);
    if (!r || !r.ok) {
      alert((r && r.error) || "Kunne ikke opprette dokument");
      return;
    }
    NEW_DOC_PICKER = false;
    ACTIVE_DOC = r.template || file;
    if (r.job) {
      PENDING_STREAM_DONE = { name: r.name_no || file, file: ACTIVE_DOC };
      pollJob(r.job, PROJECT.id, { host: "#prog-generate", surface: "editor" });
    }
    await renderProject(PROJECT.id);
    // Ensure tab / active doc after refresh
    ACTIVE_DOC = r.template || ACTIVE_DOC || file;
    setEditorRail("tools");
    scrollToDocPanel();
    if (r.banner || r.need_folder) {
      showNeedFolderOrBanner(r.banner || "");
    }
    if (isSketch || r.sketch) {
      setTimeout(() => renderSketchCanvas(), 80);
    }
    showToast((r.name_no || "Dokument") + " opprettet");
  } catch (e) {
    console.error("[doc/create] fail", e);
    const msg = (e.payload && e.payload.error) || e.message || "Kunne ikke opprette dokument";
    alert(msg);
  }
}
