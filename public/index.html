let _editorFoldObserver = null;
let _immersiveScrollBound = false;

function setEditorImmersive(on) {
  const panel = $("#doc-panel");
  if (!panel) {
    document.body.classList.remove("editor-immersive");
    $("#doc-panel-ph")?.remove();
    $("#immersive-exit")?.remove();
    return;
  }
  const want = !!on;
  const is = document.body.classList.contains("editor-immersive");
  if (want === is) return;
  if (want) {
    let ph = $("#doc-panel-ph");
    if (!ph) {
      ph = document.createElement("div");
      ph.id = "doc-panel-ph";
      panel.parentNode.insertBefore(ph, panel);
    }
    ph.style.height = Math.max(panel.offsetHeight, 480) + "px";
    document.body.classList.add("editor-immersive");
    if (!$("#immersive-exit")) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.id = "immersive-exit";
      btn.className = "immersive-exit";
      btn.textContent = "↑ Prosjekt";
      btn.onclick = () => exitEditorImmersive();
      panel.appendChild(btn);
    }
    collapseStepsForDocument();
  } else {
    document.body.classList.remove("editor-immersive");
    $("#doc-panel-ph")?.remove();
    $("#immersive-exit")?.remove();
  }
}

function exitEditorImmersive() {
  setEditorImmersive(false);
  const target = $("#project-step") || $("#sources-step-fold");
  (target || document.body).scrollIntoView({ behavior: "smooth", block: "start" });
}

function syncEditorImmersive() {
  const panel = $("#doc-panel");
  if (!panel || !$("#main")?.classList.contains("editor-mode")) {
    setEditorImmersive(false);
    return;
  }
  const headerH = 52;
  const immersive = document.body.classList.contains("editor-immersive");
  if (!immersive) {
    if (panel.getBoundingClientRect().top <= headerH + 16) setEditorImmersive(true);
    return;
  }
  const anchor = $("#doc-panel-ph") || panel;
  // Scrolled back up — placeholder sits below the fold of steps 1–2
  if (anchor.getBoundingClientRect().top > headerH + 48) setEditorImmersive(false);
}

function setupEditorScrollFolds() {
  if (_editorFoldObserver) {
    _editorFoldObserver.disconnect();
    _editorFoldObserver = null;
  }
  const doc = $("#doc-panel");
  if (!doc) {
    setEditorImmersive(false);
    return;
  }
  if (!_immersiveScrollBound) {
    _immersiveScrollBound = true;
    window.addEventListener("scroll", () => syncEditorImmersive(), { passive: true });
    window.addEventListener("resize", () => {
      const ph = $("#doc-panel-ph");
      const panel = $("#doc-panel");
      if (ph && panel && document.body.classList.contains("editor-immersive")) {
        /* keep placeholder roughly in sync if layout changes */
      }
      syncEditorImmersive();
    }, { passive: true });
  }
  if (typeof IntersectionObserver !== "undefined") {
    _editorFoldObserver = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (e.isIntersecting && e.intersectionRatio >= 0.12) collapseStepsForDocument();
      }
      syncEditorImmersive();
    }, { threshold: [0.12, 0.3], rootMargin: "-8% 0px -35% 0px" });
    _editorFoldObserver.observe(doc);
  }
  syncEditorImmersive();
}

function scrollToDocPanel() {
  collapseStepsForDocument();
  const panel = $("#doc-panel");
  if (!panel) return;
  panel.scrollIntoView({ behavior: "smooth", block: "start" });
  setTimeout(() => setEditorImmersive(true), 320);
}

function updateGenStreamStatus(j) {
  const el = $("#gen-stream-status");
  if (!el) return;
  if (j.status === "error") {
    el.textContent = "feilet";
    return;
  }
  const jobId = j.id || "";
  const step = (j.step || "").toLowerCase();
  const counter = j.total ? `${j.done || 0}/${j.total}` : "";
  const eta = (j.eta_s != null && j.eta_s > 0) ? `~${j.eta_s}s igjen`
    : (j.detail || "").match(/~\d+\s*s/)?.[0] || "";
  let core = "";
  if (j.total && (step.includes("generer") || step.includes("kartlegg") || j.done != null)) {
    core = `kartlegger ${counter || "…"} seksjoner`;
  } else if (j.detail) {
    core = j.detail;
  } else if (j.step) {
    core = j.step;
  } else {
    core = "…";
  }
  el.textContent = [jobId ? `jobb ${jobId}` : "", core, counter && !core.includes(counter) ? counter : "", eta]
    .filter(Boolean).join(" · ");
}

/** NAVIGATION_SPEC — concrete progress for any long job (id · step · ETA). */
const JOB_POLLS = {};

function formatJobProgressHtml(j, jobId) {
  if (j.status === "error") {
    return `<div class="err">Jobb <code>${esc(jobId)}</code> feilet: ${esc(j.error || "")}</div>`;
  }
  const done = j.done || 0;
  const total = j.total || 0;
  const pct = total ? Math.round(100 * done / total) : (j.status === "done" ? 100 : 8);
  const eta = (j.eta_s != null && j.eta_s > 0) ? `~${j.eta_s}s igjen`
    : ((j.detail || "").match(/~\d+\s*s\s*igjen/) || [])[0] || "";
  const counter = total ? `${done}/${total}` : "";
  const step = j.step || "…";
  const detail = (j.detail || "").replace(/\s*·\s*~\d+\s*s\s*igjen/, "");
  const spent = Number(j.spent_eur ?? j.cost_eur ?? 0).toFixed(2);
  const folder = j.current_folder ? ` · ${esc(j.current_folder)}` : "";
  const stopBtn = (j.kind === "index" && j.status === "running")
    ? ` <button type="button" class="btn ghost" style="padding:2px 8px;font-size:11px;margin-left:6px"
         onclick="cancelIndexJob('${esc(jobId)}')">Stopp indeksering</button>`
    : "";
  const resumeBtn = (j.kind === "index" && (j.status === "cancelled" || j.status === "paused"))
    ? ` <button type="button" class="btn" style="padding:2px 8px;font-size:11px;margin-left:6px"
         onclick="resumeIndexJob('${esc(PROJECT?.id || "")}')">Fortsett</button>
       ${j.pause_reason && /budsjett/i.test(j.pause_reason || "")
         ? `<button type="button" class="btn ghost" style="padding:2px 8px;font-size:11px"
              onclick="resumeIndexJob('${esc(PROJECT?.id || "")}', {add_budget_eur:10})">Fortsett med €10 til</button>`
         : ""}`
    : "";
  const statusLine = j.status === "done" ? ` · ferdig · €${spent}`
    : j.status === "cancelled" ? ` · stoppet · €${spent}`
    : j.status === "paused" ? ` · pauset · €${spent}`
    : ` · €${spent} brukt…`;
  return `<div class="progress"><i style="width:${pct}%"></i></div>
    <div class="mono" style="font-size:10.5px;color:var(--steel)">
      Jobb <code>${esc(jobId)}</code>
      · ${esc(step)}${counter ? ` · ${esc(counter)}` : ""}
      ${eta ? ` · ${esc(eta)}` : ""}${folder}
      ${detail ? ` · ${esc(detail)}` : ""}
      ${statusLine}${stopBtn}${resumeBtn}
    </div>`;
}

function ensureJobProgressHost(jobId, surface) {
  const hostId = "job-prog-" + jobId;
  let el = document.getElementById(hostId);
  if (el) return el;
  const log = surface === "hub" ? $("#hub-log")
    : surface === "artifact" ? $("#a-assist-log") : $("#assist-log");
  el = document.createElement("div");
  el.id = hostId;
  el.className = "assist-bubble bot job-progress";
  el.innerHTML = formatJobProgressHtml({ status: "running", step: "starter" }, jobId);
  if (log) log.appendChild(el);
  else {
    const box = $("#prog-generate");
    if (box) { box.id = hostId; return box; }
  }
  return el;
}

function pollJob(jobId, projectId, opts) {
  if (!jobId) return;
  const surface = (opts && opts.surface) || "editor";
  const hostSel = opts && opts.host;
  if (JOB_POLLS[jobId]) clearInterval(JOB_POLLS[jobId]);
  const host = hostSel ? $(hostSel) : ensureJobProgressHost(jobId, surface);
  let beats = 0;
  JOB_POLLS[jobId] = setInterval(async () => {
    try {
      const j = await api("/api/job?id=" + encodeURIComponent(jobId));
      if (!j || j.error === "unknown job") {
        clearInterval(JOB_POLLS[jobId]);
        delete JOB_POLLS[jobId];
        return;
      }
      j.id = j.id || jobId;
      // Heartbeat every ~10s (poll is 800ms → every 12 ticks)
      beats += 1;
      if (j.kind === "index" && beats % 12 === 0) {
        api("/api/index/heartbeat", { method:"POST", headers:{ "Content-Type":"application/json" },
          body: JSON.stringify({ job_id: jobId }) }).catch(() => {});
      }
      updateGenStreamStatus(j);
      if (host) host.innerHTML = formatJobProgressHtml(j, jobId);
      const box = $("#prog-generate");
      if (box && box !== host) box.innerHTML = formatJobProgressHtml(j, jobId);
      if (j.status !== "running") {
        clearInterval(JOB_POLLS[jobId]);
        delete JOB_POLLS[jobId];
        if (j.status === "error") PENDING_STREAM_DONE = null;
        if ((j.status === "done" || j.status === "cancelled" || j.status === "paused") && projectId) {
          renderProject(projectId);
        }
      }
    } catch (_) { /* keep polling */ }
  }, 800);
}

/** One generation path: agreement card, manual dropdown, and legacy callers. */
async function lagDokumentet(file) {
  if (!PROJECT?.id) return;
  file = file || $("#tpl")?.value;
  if (!file) { alert("Velg en mal først"); return; }
  const t = (BOOT?.templates || []).find(x => x.file === file);
  const name = t?.name_no || INTENT_PICK?.name_no || file;
  INTENT_PICK = { ...(INTENT_PICK || {}), file, name_no: name, choice: t?.key || INTENT_PICK?.choice };
  const sel = $("#tpl");
  if (sel) sel.value = file;

  try {
    if (ARTIFACT_DRAFT) {
      ARTIFACT_DRAFT.name = $("#a-name")?.value?.trim() || ARTIFACT_DRAFT.name;
      ARTIFACT_DRAFT.purpose = $("#a-purpose")?.value?.trim() || ARTIFACT_DRAFT.purpose;
    }
    if (!PROJECT.confirmed && ARTIFACT_DRAFT) {
      await api("/api/artifact/save", { method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ id: PROJECT.id, artifact: ARTIFACT_DRAFT, confirm: true }) });
      PROJECT.confirmed = true;
    }

    const progressInner = `Bygger <b>${esc(name)}</b> … <span id="gen-stream-status">starter</span>`;
    const card = $("#agree-card");

async function requestExport(id) {
  const template = ACTIVE_DOC;
  if (!id || !template) {
    alert("Åpne et dokument først.");
    return;
  }
  const d = activeDocMeta();
  const price = d.export_price_eur ?? 19;
  const ent = d.export_entitlement || {};
  const signed = BOOT?.account?.signed_in;
  const bal = Number(BOOT?.account?.account?.balance_eur ?? 0);
  if (signed && ent.charge !== false && bal < price && d.payment?.status !== "paid") {
    return showPaywall("export", { price, id, template });
  }
  return exportDoc(id, template);
}

function showPaywall(feature, opts = {}) {
  const price = opts.price || 19;
  if (feature === "export") {

async function exportDoc(id, template) {
  const bd = PROJECT?.blocking_dismissed || [];
  const refs = (PROJECT?.reference_facts || PROJECT?.user_facts || [])
    .filter(f => f.provenance === "reference");
  if (bd.length || refs.length) {
    const lines = [];
    if (bd.length) {
      lines.push("Avviste blokkerende krav:");
      bd.forEach(d => lines.push(`• ${d.key}: ${d.reason}`));
    }
    if (refs.length) {
      lines.push("", "AI-foreslåtte referanseverdier (~):");
      refs.forEach(f => lines.push(`• ${f.key}: ${f.value}${f.unit ? " " + f.unit : ""} ~`));
      lines.push("", "Verdier merket ~ er AI-foreslåtte referanseverdier som ikke er verifisert mot prosjektets kilder; ansvaret for verifisering ligger hos undertegnede.");
    }
    if (!confirm("Eksportansvar\n\n" + lines.join("\n") + "\n\nFortsette?")) return;
  }
  const fmt = $("#export-fmt")?.value || PROJECT?.doc?.output_format || activeDocMeta().output_format || "pdf";
  try {
    const r = await api("/api/export", { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ id, template, output_format: fmt }) });
    if (r.account) BOOT.account = r.account;
    ACCT_USAGE = null;
    renderAccountHeader();
    ACTIVE_DOC = template;
    if (r.download_base64 && r.export_name) {
      const a = document.createElement("a");
      a.href = "data:application/octet-stream;base64," + r.download_base64;
      a.download = r.export_name;
      a.click();
    }
    if (r.notices?.length) showToast(r.notices.join(" · "));
    await renderProject(id);
    if (r.watermarked) {
      showToast("Forhåndsvisning med vannmerke — logg inn og betal for ren PDF");
    } else if (r.paid) {
      showToast(`Betalt · rev ${r.revision || "A"} · ${fmtEur(r.price_eur)}`);
    } else if (r.reexport_free) {
      showToast("Re-eksport · gratis");
    }
  } catch (e) {
    if (e.status === 402 || e.payload?.need_topup) {
      return showPaywall("export", {
        price: e.payload?.price_eur || activeDocMeta().export_price_eur || 19,
        id, template,
      });
    }
    const msg = /blokker mangler/i.test(e.message || "")
      ? e.message
      : e.message === "not found"
      ? "Serveren kjører gammel versjon — stopp og start arbeidsbenken på nytt (workbench.ps1)."
      : e.message;
    alert(msg);
  }
}

async function renderFormDraft(id, template) {
  const tplMeta = BOOT.templates.find(t => t.file === template) || {};
  const secs = (tplMeta.sections || []).slice().sort((a, b) => (a.position || 0) - (b.position || 0));
  // Fallback: build from PROJECT.doc if caps lack field defs
  const docSecs = PROJECT?.doc?.sections || {};
  let html = `<div class="form-draft"><h1>${esc(tplMeta.name_no || tplMeta.name || "Skjema")}</h1>`;
  const sectionDefs = secs.length ? secs : Object.keys(docSecs).map(sk => ({
    section_key: sk, title_no: sk, fields: Object.keys(docSecs[sk]?.fields || {}).map(k => ({
      key: k, ...(docSecs[sk].fields[k] || {}),
    })),
  }));
  for (const s of sectionDefs) {
    const sk = s.section_key;
    const vals = docSecs[sk]?.fields || {};
    const fields = s.fields || [];
    if (!fields.length && !vals) continue;
    const cols = s.columns === 2 ? " cols-2" : "";
    html += `<div class="form-sec sec-wrap" id="sec-${sk}" data-section="${sk}">
      <h2>${esc(s.title_no || s.title || sk)}</h2>
      <div class="form-grid${cols}">`;
    for (const f of fields) {
      const key = f.key;
      const slot = vals[key] || {};
      const label = f.label_no || f.label || key;
      const req = f.required ? `<span class="req">*</span>` : "";
      const ftype = f.type || slot.type || "text";
      const val = slot.value;
      html += `<div class="form-field" data-section="${sk}" data-key="${key}">
        <label>${esc(label)} ${req}</label>`;
      if (slot.source && val != null && val !== "") {
        html += `<span class="cited-chip" title="Fra indeks">${esc(String(val))}${f.unit || slot.unit ? " " + esc(f.unit || slot.unit) : ""} ✓</span>
          <button type="button" class="btn ghost" style="font-size:11px;align-self:start"
            onclick="formEditField('${sk}','${key}','${ftype}')">Endre</button>`;
      } else if (ftype === "rating3") {
        html += `<div class="rating3">
          <button type="button" class="${val==="ok"?"on-ok":""}" onclick="formSetField('${sk}','${key}','ok')">OK</button>
          <button type="button" class="${val==="attention"?"on-attention":""}" onclick="formSetField('${sk}','${key}','attention')">Obs</button>
          <button type="button" class="${val==="immediate"?"on-immediate":""}" onclick="formSetField('${sk}','${key}','immediate')">Akutt</button>
        </div>`;
      } else if (ftype === "check") {
        html += `<label class="form-check"><input type="checkbox" ${val ? "checked" : ""}
          onchange="formSetField('${sk}','${key}', this.checked)" /> Utført</label>`;
      } else if (ftype === "measure") {
        html += `<div style="display:flex;gap:8px;align-items:center">
          <input type="number" inputmode="decimal" value="${val != null ? esc(String(val)) : ""}"
            onchange="formSetField('${sk}','${key}', this.value, '${esc(f.unit || "")}')"
            placeholder="—" />
          <span style="font-size:12px;color:var(--steel)">${esc(f.unit || "")}</span>
        </div>`;
      } else if (ftype === "signature") {
        html += `<input class="form-sig" type="text" value="${val != null ? esc(String(val)) : ""}"
          placeholder="Tegn / skriv navn" onchange="formSetField('${sk}','${key}', this.value)" />`;
      } else if (ftype === "date") {
        html += `<input type="date" value="${val != null ? esc(String(val)) : ""}"
          onchange="formSetField('${sk}','${key}', this.value)" />`;
      } else {
        html += `<textarea rows="2" onchange="formSetField('${sk}','${key}', this.value)">${val != null ? esc(String(val)) : ""}</textarea>`;
      }
      html += `</div>`;
    }
    html += `</div></div>`;
  }
  html += `</div>`;
  $("#draft-area").innerHTML = html;
  $("#diff-area").innerHTML = "";
  updateAssistScope();
}

async function formSetField(section, key, value, unit) {
  if (!PROJECT?.id) return;

    const r = await api("/api/doc/form-field", { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        id: PROJECT.id, template: ACTIVE_DOC, section, key, value,
        unit: unit || undefined,
      }) });
    if (r.gaps) PROJECT.gaps = r.gaps;
    if (r.gap_summary) PROJECT.gap_summary = r.gap_summary;

async function loadDraft(id, template) {
  // WORKORDER 0.59 — sketch documents render A4 canvas, not markdown only
  const species = PROJECT?.doc?.document_species
    || BOOT.templates.find(t => t.file === template)?.document_species
    || (PROJECT?.documents || []).find(d => d.template === template)?.document_species;
  if (species === "sketch" || template === "sketch_document.json" || PROJECT?.doc?.sketch?.mode) {
    renderSketchCanvas();
    return;
  }
  // WORKORDER_0.29 — form_fill renders interactive fields, not marked prose
  const hasForm = species === "form_fill"
    || Object.values(PROJECT?.doc?.sections || {}).some(s => s?.block_type === "form_section" || s?.fields);
  if (hasForm) {
    await renderFormDraft(id, template);
    return;
  }
  const q = template ? "&template=" + encodeURIComponent(template) : "";
  const md = await api("/api/draft?id=" + id + q);
  const tplMeta = BOOT.templates.find(t => t.file === template);
  const titleToKey = {};
  (tplMeta?.sections || []).forEach(s => {
    [s.title_no, s.title, s.section_key].forEach(t => { if (t) titleToKey[t.trim().toLowerCase()] = s.section_key; });
  });
  const excludedFigKeys = new Set((PROJECT?.excluded_figures || []).map(e => `${e.file}|${e.page || 0}`));
  const figKey = (file, page) => `${file}|${page}`;
  const gapBySec = {};
  (PROJECT?.gaps || []).forEach(g => {
    if (!g.section) return;
    gapBySec[g.section] = gapBySec[g.section] || [];
    gapBySec[g.section].push(g);
  });
  const parts = md.split(/\n(?=## )/);
  let h1 = parts[0] || "";
  let bodyParts = parts[0]?.startsWith("##") ? parts : parts.slice(1);
  if (!parts[0]?.startsWith("##") && parts.length > 1) bodyParts = parts.slice(1);
  let html = h1 && !h1.startsWith("##") ? marked.parse(h1) : "";
  const srcSet = new Set();
  for (const part of bodyParts) {
    const lines = part.split("\n");
    const heading = lines[0].replace(/^#+\s*/, "").trim();
    const secMd = lines.slice(1).join("\n");
    const secKey = titleToKey[heading.toLowerCase()] || heading;
    const secFiles = PROJECT?.doc?.sections?.[secKey]?.files || [];
    secFiles.forEach(f => srcSet.add(f));
    const sevMap = Object.fromEntries((gapBySec[secKey] || []).map(g => [g.key, g.severity || "blocking"]));
    const hasBlocking = (gapBySec[secKey] || []).some(g => g.severity === "blocking");
    // Figure markers → preview with remove button
    let secMdFigs = secMd.replace(/\{\{figure:([^}|]+):(\d+)(?:\|([^}]*))?\}\}/g, (_, file, page, cap) => {
      if (excludedFigKeys.has(figKey(file, parseInt(page, 10)))) return "";
      const src = `/api/media?id=${id}&file=${encodeURIComponent(file)}&page=${page}`;
      const label = (cap || file).replace(/</g, "");
      const fEnc = encodeURIComponent(file);
      return `\n\n<div class="fig-wrap"><figure class="fd-fig" data-section="${secKey}" data-file="${fEnc}" data-page="${page}">
        <button type="button" class="fig-remove" title="Fjern illustrasjon" onclick="event.stopPropagation();removeFigure('${secKey}','${fEnc}',${page})">×</button>
        <img src="${src}" alt="${label}" loading="lazy" onclick="event.stopPropagation();openFigLightbox(this.src)" />
        <figcaption class="cap">${label}</figcaption>
      </figure></div>\n\n`;
    });
    const tableData = PROJECT?.doc?.sections?.[secKey]?.table;
    let secHtml;
    if (tableData?.rows?.length) {
      // SOURCE_INTERACTION S2: structured grid instead of dead markdown table
      TABLE_DATA[secKey] = tableData;
      secHtml = renderInteractiveTable(secKey, tableData)
        + (tableData.note ? marked.parse(tableData.note) : "");
    } else {
      secHtml = marked.parse(secMdFigs);
    }
    secHtml = secHtml.replace(/<table>/g, '<div class="table-wrap"><table>').replace(/<\/table>/g, '</table></div>');
    // marked sometimes wraps block HTML in <p> — breaks figure layout
    secHtml = secHtml.replace(/<p>\s*(<div class="fig-wrap">[\s\S]*?<\/div>)\s*<\/p>/g, "$1");
    secHtml = secHtml.replace(/<p>\s*(<figure class="fd-fig"[\s\S]*?<\/figure>)\s*<\/p>/g, "$1");
    const chip = (key) => {
      const sev = sevMap[key] || "blocking";
      const cands = findManglerCandidates(key, secKey);
      const cls = cands.length ? "mangler-btn hint-ok" : "mangler-btn";
      const hint = cands.length ? " — fil funnet" : " — oppgi";
      return `<button type="button" class="${cls}" data-key="${key}"
        onmouseenter="syncGapHover('${key}',true)" onmouseleave="syncGapHover('${key}',false)"
        onclick="event.stopPropagation();openManglerMenu('${key}','${secKey}','${sev}',event)">MANGLER: ${key}${hint}</button>`;
    };
    secHtml = secHtml.replace(/<code>\[MANGLER:\s*([\w_]+)\]<\/code>/g, (_, key) => chip(key));
    secHtml = secHtml.replace(/`\[MANGLER:\s*([\w_]+)\]`/g, (_, key) => chip(key));
    if (secKey === "bom") {
      secHtml = secHtml.replace(/\[MANGLER:\s*([^\]]+)\]/g, (_, inner) => {
        const likely = inner.match(/sjekk:\s*(.+)$/i);
        const fileHint = likely ? likely[1].split(",")[0].trim() : "";
        const likelyArg = fileHint ? `,'${encodeURIComponent(fileHint)}'` : ",''";
        return `<button type="button" class="mangler-btn bom-mangler" onclick="event.stopPropagation();openBomMangler('${secKey}','${encodeURIComponent(inner.trim())}'${likelyArg})">MANGLER: ${esc(inner.trim())}</button>`;
      });
    }
    secHtml = secHtml.replace(/\*\*([^*]+)\s✓\*\*/g, '<span class="verified" title="Oppgitt manuelt av bruker">$1 ✓</span>');
    secHtml = secHtml.replace(/\*\*([^*]+)\s~\*\*/g, '<span class="reference" title="AI-foreslått — ikke verifisert mot kilde. Verifiser mot håndbok/typeskilt.">$1 ~</span>');
    secHtml = secHtml.replace(/\*\*([^*]+)\*\*/g, (m, v) =>
      v.includes("✓") || v.includes("~") ? m : `<span class="cited" title="Sitert fra kilde">${v}</span>`);
    const sel = CHAT_SCOPE.section === secKey ? " selected" : "";
    const block = hasBlocking ? " has-blocking" : "";
    const citeWarns = (PROJECT?.source_citation_warnings || []).filter(w => w.section === secKey);
    const warnFile = citeWarns[0]?.file || "";
    const warnFileEsc = esc(warnFile).replace(/'/g, "\\'");
    const citeBanner = citeWarns.length
      ? `<div class="source-warn-banner" onclick="event.stopPropagation()">
          <span>⚠ <b>Kilde ekskludert</b> — ${citeWarns.reduce((n, w) => n + (w.count || 0), 0)} sitering(er) berørt</span>
          <button type="button" class="btn ghost" style="padding:4px 10px;font-size:11px"
            onclick="regenSection('${id}','${template}','${secKey}')">Regenerer · ~€0.05</button>
          ${warnFile ? `<button type="button" class="btn ghost" style="padding:4px 10px;font-size:11px"
            onclick="undoSourceExclusion('${warnFileEsc}')">Angre ekskludering</button>` : ""}
        </div>`
      : "";
    html += `<div class="sec-wrap${sel}${block}" id="sec-${secKey}" data-section="${secKey}" onclick="selectSection('${secKey}', event)">
      <div class="sec-toolbar" onclick="event.stopPropagation()">
        <button type="button" onclick="regenSection('${id}','${template}','${secKey}')">↻ Regenerer</button>
        ${secKey === "bom" ? `<button type="button" onclick="refreshBom()">↻ Oppdater BOM</button>` : ""}
        ${secKey === "doc_control" ? `<button type="button" onclick="refreshDocControl()">↻ Oppdater fra kilder</button>` : ""}
        ${secKey === "spec_overview" ? `<button type="button" onclick="refreshSpecOverview()">↻ Oppdater fra kilder</button>` : ""}
        <button type="button" onclick="askAssistAboutSection('${secKey}')">💬 Spør assistent</button>
        <details class="adv-edit"><summary>Avansert ▾</summary>
          <div style="display:flex;gap:6px;margin-top:6px">
            <button type="button" onclick="editSection('${secKey}')">Markdown</button>
            <button type="button" onclick="revertSection('${secKey}')">Tilbakestill</button>
          </div>
        </details>
      </div>
      ${citeBanner}
      <h2>${esc(heading)}</h2>${secHtml}
    </div>`;
  }
  $("#draft-area").innerHTML = `<div class="draft draft-annot-host" id="draft-annot-host">${html}</div>`;
  $("#diff-area").innerHTML = "";
  ANNOT.boundHost = null; // host was replaced — rebind drawing on ensureAnnotLayer
  LAST_DOC_SOURCE_NAMES = [...srcSet];
  renderDocSources(LAST_DOC_SOURCE_NAMES);
  renderExcludedFigures();
  wireBlockDiagramHover();
  updateAssistScope();
  ensureAnnotLayer();
}

function wireBlockDiagramHover() {
  const root = $("#draft-area");
  if (!root) return;
  root.querySelectorAll('svg[data-foldok="connection_spec"] path[data-from]').forEach(path => {
    path.style.cursor = "pointer";
    path.addEventListener("mouseenter", () => {
      const from = (path.getAttribute("data-from") || "").split(".")[0];
      const rect = root.querySelector(`rect[data-component="${from}"]`);
      const file = (rect && rect.getAttribute("data-image")) || "";
      document.querySelectorAll(".src-file.src-lit").forEach(r => r.classList.remove("src-lit"));
      if (file) {
        const row = document.querySelector(`.src-file[data-srcfile="${CSS.escape(file)}"]`)
          || [...document.querySelectorAll(".src-file")].find(r =>
            (r.dataset.srcfile || "").endsWith(file.split("/").pop()));
        if (row) row.classList.add("src-lit");
      }
      path.setAttribute("stroke-width", "3");
    });
    path.addEventListener("mouseleave", () => {
      path.setAttribute("stroke-width", "1.5");
      document.querySelectorAll(".src-file.src-lit").forEach(r => r.classList.remove("src-lit"));
    });
  });
}

async function loadSectionFigures(el) {
  const files = (el.dataset.files || "").split("|").filter(Boolean);
  if (!files.length || !PROJECT?.id) {
    el.innerHTML = "";
    return;
  }
  const cards = [];
  for (const file of files.slice(0, 8)) {
    try {
      const meta = await api("/api/media/meta?id=" + PROJECT.id + "&file=" + encodeURIComponent(file));
      if (!meta.visual && meta.kind !== "photo") continue;
      const pages = meta.show_pages || 1;
      for (let page = 0; page < pages; page++) {
        const src = `/api/media?id=${PROJECT.id}&file=${encodeURIComponent(file)}&page=${page}`;
        const label = pages > 1 ? `${file.split("/").pop()} · side ${page + 1}` : file.split("/").pop();
        cards.push(`<div class="fig-card">
          <img src="${src}" alt="${esc(label)}" loading="lazy" onclick="event.stopPropagation();openFigLightbox('${src.replace(/'/g, "\\'")}')" />
          <div class="cap"><b>${esc(label)}</b>${esc(meta.caption || "")}</div>
        </div>`);
      }
    } catch (_) { /* skip unreadable */ }
  }
  el.innerHTML = cards.length
    ? cards.join("")
    : `<div class="mono" style="font-size:11px;color:var(--steel);grid-column:1/-1">Ingen illustrasjoner knyttet til denne seksjonen ennå — legg bilder i prosjektmappen eller regenerer etter indeksering.</div>`;
}

const RAIL_SCROLL_POS = {};

function setEditorRail(mode, opts) {
  // WORKORDER 0.58 §C4 — preserve scroll positions across tab switches
  const bodyEl = $("#rail-body");
  const canvas = document.querySelector(".editor-canvas");
  if (EDITOR_RAIL && bodyEl) RAIL_SCROLL_POS[EDITOR_RAIL] = bodyEl.scrollTop;
  if (canvas) DOC_SCROLL_POS = canvas.scrollTop;

  EDITOR_RAIL = mode || "documents";
  if (!opts || opts.user !== false) window.__editorRailUser = true;
  document.querySelectorAll("#editor-flow button").forEach(btn => {
    btn.classList.toggle("on", btn.dataset.rail === EDITOR_RAIL);
  });
  renderEditorRail();
  if (EDITOR_RAIL !== "tools" && ANNOT.on) setAnnotLayer(false);

  requestAnimationFrame(() => {
    const b2 = $("#rail-body");
    const c2 = document.querySelector(".editor-canvas");
    if (b2 && RAIL_SCROLL_POS[EDITOR_RAIL] != null) b2.scrollTop = RAIL_SCROLL_POS[EDITOR_RAIL];
    if (c2) c2.scrollTop = DOC_SCROLL_POS;
  });
}

function gapActionFor(g) {
  const t = (g.type || "").toLowerCase();
  if (t.includes("media") || t.includes("photo") || t.includes("figure")) {
    return { label: "Locate", kind: "locate" };
  }
  if (t.includes("section") || (g.key || "").includes("section")) {
    return { label: "Generate", kind: "generate" };
  }
  return { label: "Løs", kind: "resolve" };
}

function runGapAction(key, section, severity, kind) {
  const sev = severity || "blocking";
  if (kind === "generate" && section) {
    setEditorRail("documents");
    selectSection(section);
    askAssistAboutSection(section);
    return;
  }
  openManglerMenu(key, section, sev, null);
  if (kind === "locate") {
    setTimeout(() => { try { manglerPanel("source"); } catch (_) {} }, 60);
  }
}

function findGapTargetEl(g) {
  if (!g) return null;
  const key = g.key || "";
  const sec = g.section || "";
  const host = $("#draft-annot-host") || $("#draft-area");
  if (!host) return null;
  let el = key ? host.querySelector(`.mangler-btn[data-key="${CSS.escape(key)}"]`) : null;
  if (!el && key) el = host.querySelector(`[data-key="${CSS.escape(key)}"]`);
  if (!el && sec) el = host.querySelector(`.sec-wrap[data-section="${CSS.escape(sec)}"]`);
  return el;
}

function clearGapTargetRings() {
  document.querySelectorAll(".gap-target-ring, .gap-target-pulse, .gap-hot").forEach(el => {
    el.classList.remove("gap-target-ring", "gap-target-pulse", "gap-hot");

}

function syncGapHover(key, on) {

    el.classList.toggle("gap-hot", !!on);
  });
  document.querySelectorAll(`.mangler-btn[data-key="${CSS.escape(key || "")}"]`).forEach(el => {
    el.classList.toggle("gap-hot", !!on);
  });
}

function assembleGapExplain(g) {
  if (!g) return "";
  const n = PROJECT?.index_file_count || (PROJECT?.files || []).filter(f => f.kind !== "skipped").length || 0;
  const label = (g.label || g.key || "Felt").trim();
  const sevNo = { blocking: "blokkerende", warning: "advarsel", info: "info" }[g.severity] || (g.severity || "advarsel");
  const cand = g.candidate || {};
  const parts = [`**${label}** kreves av malen (${sevNo}).`];
  if (cand.value) {
    const src = String(cand.file || "").split(/[/\\]/).pop() || "kilde";
    parts.push(`Funn: «${cand.value}» i ${src}.`);
  } else if (g.index_hits) {
    parts.push(`Funnet ${g.index_hits} treff i indeksen.`);
  } else if (n) {
    parts.push(`Ikke funnet i de ${n} indekserte filene.`);
  } else {
    parts.push("Ingen indekserte filer å søke i ennå.");
  }
  const notes = (g.section_notes || "").trim();
  if (notes) {
    const hint = notes.split(".")[0].trim();
    if (hint) parts.push(hint.endsWith(".") ? hint : hint + ".");
  } else if ((g.likely_sources || []).length) {
    const files = g.likely_sources.slice(0, 2).map(f => String(f).split(/[/\\]/).pop()).join(", ");
    if (files) parts.push(`Sjekk typisk: ${files}.`);
  }
  let text = parts.join(" ");
  const words = text.replace(/\*\*/g, "").split(/\s+/);
  if (words.length > 60) text = words.slice(0, 58).join(" ") + "…";
  return text;
}

function gapAssistButtonsHtml(g) {
  if (!g) return "";
  const key = esc(g.key || "");
  const sec = esc(g.section || "");
  const sev = esc(g.severity || "warning");
  const fillable = PROJECT?.fillable_gaps || 0;
  const cand = g.candidate || {};
  const btns = [];
  if (fillable > 0) {
    btns.push(`<button type="button" class="btn" onclick="fillKnownGaps()">Fyll inn det vi vet (${fillable})</button>`);
  } else if (cand.value && cand.fact_id) {
    const src = esc(String(cand.file || "").split(/[/\\]/).pop() || "kilde");
    btns.push(`<button type="button" class="btn" onclick="applyCited('${key}','${esc(cand.fact_id)}')">Bruk «${esc(String(cand.value))}» fra ${src} · gratis</button>`);
  } else if (cand.value) {
    const v = JSON.stringify(String(cand.value));
    const u = JSON.stringify(cand.unit || "");
    btns.push(`<button type="button" class="btn" onclick='resolveMangler(${JSON.stringify(g.key)},${v},${u},"user")'>Bruk «${esc(String(cand.value))}» · gratis</button>`);
  } else if ((g.likely_sources || []).length || (g.index_hits || 0) > 0) {
    btns.push(`<button type="button" class="btn" onclick="runGapAction('${key}','${sec}','${sev}','locate')">Pek på kilden · €0,003</button>`);
  }
  btns.push(`<button type="button" class="btn ghost" onclick="runGapAction('${key}','${sec}','${sev}','resolve')">Skriv inn verdi · gratis</button>`);
  if (g.allows_suggest !== false) {
    btns.push(`<button type="button" class="btn ghost" onclick="gapSuggestValue('${key}','${sec}','${sev}')">Foreslå verdi · €0,004</button>`);
  }
  btns.push(`<button type="button" class="btn ghost" onclick="gapDismissQuick('${key}','${sec}','${sev}')">Ikke relevant · gratis</button>`);
  btns.push(`<button type="button" class="btn ghost" onclick="focusNextGap()">Neste hull · gratis</button>`);
  return `<div class="assist-gap-actions">${btns.slice(0, 4).join("")}</div>`;
}

async function gapSuggestValue(key, section, severity) {
  openManglerMenu(key, section, severity || "warning", null);
  setTimeout(() => { try { loadReferenceOffer(); } catch (_) {} }, 80);
}

async function gapDismissQuick(key, section, severity) {
  const sev = severity || "warning";
  let reason = "Ikke relevant for dette prosjektet";
  if (sev === "blocking") {
    reason = prompt("Begrunnelse for å avvise blokkerende mangel:") || "";
    if (!reason.trim()) return;
  }
  await api("/api/doc/dismiss", { method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ id: PROJECT.id, template: ACTIVE_DOC, key, section, reason, severity: sev }) });
  await renderProject(PROJECT.id);
}

function postGapAssistExplain(g) {
  if (!g) return;
  const html = formatConvHtml(assembleGapExplain(g)) + gapAssistButtonsHtml(g);
  assistBubble("bot", html);
  $("#assist-dock")?.classList.add("open");
}

function focusGapAt(idx, { explain = true, scrollList = true } = {}) {
  const gaps = PROJECT?.gaps || [];
  if (!gaps.length) return;
  const i = ((idx % gaps.length) + gaps.length) % gaps.length;
  const g = gaps[i];
  GAP_FOCUS_IDX = i;
  GAP_FOCUS_KEY = g.key || null;

  document.querySelectorAll(".gap-card").forEach((el, j) => {
    el.classList.toggle("gap-focus", j === i);
    if (j === i && scrollList) el.scrollIntoView({ block: "nearest" });
  });

  clearGapTargetRings();
  const target = findGapTargetEl(g);
  if (target) {
    target.scrollIntoView({ block: "center", behavior: "smooth" });
    target.classList.add("gap-target-ring", "gap-target-pulse");
    setTimeout(() => target.classList.remove("gap-target-pulse"), 1000);
  }

  if (g.section) {
    CHAT_SCOPE = { type: "section", section: g.section };
    document.querySelectorAll(".sec-wrap").forEach(el => {
      el.classList.toggle("selected", el.dataset.section === g.section);
    });
    const title = g.section_title || g.section;
    const scope = $("#assist-scope");
    if (scope) scope.textContent = `Seksjon: ${title}`;
  }

  if (explain) postGapAssistExplain(g);
}

function focusNextGap() {
  const gaps = PROJECT?.gaps || [];
  if (!gaps.length) return;
  focusGapAt(GAP_FOCUS_IDX < 0 ? 0 : GAP_FOCUS_IDX + 1);
}

function onGapsListKey(ev) {
  if (EDITOR_RAIL !== "gaps") return;
  const gaps = PROJECT?.gaps || [];
  if (!gaps.length) return;
  if (ev.key === "ArrowDown") {
    ev.preventDefault();
    focusGapAt(GAP_FOCUS_IDX < 0 ? 0 : GAP_FOCUS_IDX + 1, { explain: true });
  } else if (ev.key === "ArrowUp") {
    ev.preventDefault();
    focusGapAt(GAP_FOCUS_IDX < 0 ? gaps.length - 1 : GAP_FOCUS_IDX - 1, { explain: true });
  } else if (ev.key === "Enter") {
    ev.preventDefault();
    focusGapAt(GAP_FOCUS_IDX < 0 ? 0 : GAP_FOCUS_IDX, { explain: true });
  } else if (ev.key === "Escape") {
    ev.preventDefault();
    $("#rail-body")?.focus();
  }
}

function isSketchDocument() {
  const species = PROJECT?.doc?.document_species
    || BOOT?.templates?.find(t => t.file === ACTIVE_DOC)?.document_species;
  return species === "sketch" || ACTIVE_DOC === "sketch_document.json"
    || !!(PROJECT?.doc?.sketch?.mode);
}

function setSketchTool(id) {

}

function renderSketchCanvas() {
  // Never write into #doc-panel — that destroys the editor shell (rail + assist).
  let draft = $("#draft-annot-host") || $("#draft-area");
  if (!draft) return;
  if (draft.id === "draft-area") {
    draft.innerHTML = `<div class="draft draft-annot-host" id="draft-annot-host"></div>`;
    draft = $("#draft-annot-host");
    if (!draft) return;
  }
  const phs = (PROJECT?.doc?.sketch?.placeholders) || [];
  const emptyHint = !(PROJECT?.files || []).some(f => f.indexed)
    ? `<div class="mono" style="font-size:12px;margin:8px 12px">Legg til filer i kilder for å fylle blokker.</div>`
    : "";
  draft.innerHTML = `
    <div id="sketch-a4" class="sketch-a4" style="position:relative;width:595px;max-width:100%;
      min-height:842px;margin:12px auto;background:#fff;border:1px solid var(--border,#ddd);
      box-shadow:0 1px 4px rgba(0,0,0,.06);touch-action:none">
      ${emptyHint}
      ${phs.map(renderSketchPlaceholderHtml).join("")}
    </div>`;
  bindSketchDraw($("#sketch-a4"));
}

function renderSketchPlaceholderHtml(ph) {
  const typeLabel = {
    table: "Tabell", text: "Tekst", figure: "Figur", list: "Liste",
    warning: "Advarsel", signature: "Signatur", divider: "Skille", heading: "Overskrift",
  }[ph.type] || ph.type;
  const bound = ph.bound_section
    ? `${typeLabel} → ${ph.label || ph.bound_section}`
    : (ph.label ? `${typeLabel} · ikke gjenkjent` : typeLabel);
  const fillBtn = (ph.label || "").trim()
    ? `<button type="button" class="btn" style="padding:2px 8px;font-size:11px;margin-top:4px"
         onclick="event.stopPropagation();fillSketchPlaceholder('${esc(ph.id)}')">Fyll fra kilder · gratis</button>`
    : "";
  const mdPreview = ph.filled && ph.md
    ? `<div class="sketch-md" style="font-size:11px;margin-top:6px;max-height:120px;overflow:auto">${esc((ph.md || "").slice(0, 400))}</div>`
    : `<div class="mono" style="font-size:11px;color:var(--steel);margin-top:4px">${esc(ph.prompt || "")}</div>`;
  const sug = (!(ph.recognized) && (ph.suggestions || []).length)
    ? `<select style="font-size:11px;margin-top:4px" onclick="event.stopPropagation()"
         onchange="bindSketchType('${esc(ph.id)}', this.value)">
         <option value="">velg type ▾</option>
         ${(ph.suggestions || []).map(s =>
           `<option value="${esc(s.key)}">${esc(s.key)}</option>`).join("")}
       </select>`
    : "";
  return `<div class="sketch-ph" data-id="${esc(ph.id)}"
    style="position:absolute;left:${ph.x}px;top:${ph.y}px;width:${ph.w}px;min-height:${ph.h}px;
      border:1.5px dashed #5A6472;background:rgba(247,246,242,.92);padding:6px 8px;box-sizing:border-box">
    <div class="chip" style="font-size:11px">${esc(bound)} ▾</div>
    <input type="text" value="${esc(ph.label || "")}" placeholder="Merk blokken…"
      style="width:100%;margin-top:4px;font-size:12px;padding:3px 6px"
      onclick="event.stopPropagation()"
      onchange="labelSketchPlaceholder('${esc(ph.id)}', this.value)" />
    ${sug}${fillBtn}${mdPreview}
  </div>`;
}

let _sketchDraw = null;
function bindSketchDraw(host) {
  if (!host) return;
  if (host.dataset.bound === "1") return;
  host.dataset.bound = "1";
  host.addEventListener("pointerdown", (e) => {
    if (e.target.closest(".sketch-ph, button, input, select, a")) return;
    e.preventDefault();
    const b = host.getBoundingClientRect();
    _sketchDraw = { x0: e.clientX - b.left, y0: e.clientY - b.top, el: null };
    const rub = document.createElement("div");
    rub.className = "sketch-rubber";
    rub.style.cssText = `position:absolute;left:${_sketchDraw.x0}px;top:${_sketchDraw.y0}px;
      width:0;height:0;border:1px dashed var(--accent,#C45C26);pointer-events:none;z-index:5`;
    host.appendChild(rub);
    _sketchDraw.el = rub;
    host.setPointerCapture?.(e.pointerId);
  });
  host.addEventListener("pointermove", (e) => {
    if (!_sketchDraw?.el) return;
    const b = host.getBoundingClientRect();
    const x = e.clientX - b.left, y = e.clientY - b.top;
    const x0 = Math.min(_sketchDraw.x0, x), y0 = Math.min(_sketchDraw.y0, y);
    const w = Math.abs(x - _sketchDraw.x0), h = Math.abs(y - _sketchDraw.y0);
    Object.assign(_sketchDraw.el.style, { left: x0 + "px", top: y0 + "px", width: w + "px", height: h + "px" });
  });
  host.addEventListener("pointerup", async (e) => {
    if (!_sketchDraw) return;
    const b = host.getBoundingClientRect();
    const x = e.clientX - b.left, y = e.clientY - b.top;
    const x0 = Math.min(_sketchDraw.x0, x), y0 = Math.min(_sketchDraw.y0, y);
    const w = Math.abs(x - _sketchDraw.x0), h = Math.abs(y - _sketchDraw.y0);
    _sketchDraw.el?.remove();
    _sketchDraw = null;
    if (w < 24 || h < 18) return;
    await addSketchPlaceholder({ type: SKETCH_TOOL, x: x0, y: y0, w, h });
  });
}

async function addSketchPlaceholder(box) {
  if (!PROJECT?.id || !ACTIVE_DOC) return;
  const t0 = performance.now();
  try {
    const r = await api("/api/doc/sketch/upsert", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        id: PROJECT.id, template: ACTIVE_DOC,
        type: box.type || SKETCH_TOOL, x: box.x, y: box.y, w: box.w, h: box.h,
        label: box.label || "",
      }),
    });
    if (r.token_delta) console.warn("sketch upsert used tokens", r.token_delta);
    PROJECT.doc = PROJECT.doc || {};
    PROJECT.doc.sketch = PROJECT.doc.sketch || { mode: true, placeholders: [] };
    PROJECT.doc.sketch.placeholders = r.placeholders || [];
    renderSketchCanvas();
    renderEditorRail();
    if (performance.now() - t0 > 150) console.info("sketch upsert ms", Math.round(performance.now() - t0));
  } catch (e) { showToast(e.message); }
}

function setAnnotLayer(on) {
  ANNOT.on = !!on;
  const host = $("#draft-annot-host");
  if (!host) return;

  host.classList.toggle("annot-sel", ANNOT.on && ANNOT.tool === "sel");

function ensureAnnotLayer() {

function clearAnnotMarks() {

function annotHostPoint(e) {
  const host = $("#draft-annot-host");
  if (!host) return { x: 0, y: 0 };
  const b = host.getBoundingClientRect();
  return { x: e.clientX - b.left, y: e.clientY - b.top };
}

function annotMeasureSections() {
  const host = $("#draft-annot-host");
  if (!host) return {};
  const base = host.getBoundingClientRect();
  const r = {};
  host.querySelectorAll(".sec-wrap[data-section]").forEach(el => {
    const b = el.getBoundingClientRect();
    r[el.dataset.section] = {
      x: b.left - base.left,
      y: b.top - base.top,
      w: b.width,
      h: b.height,
      label: (el.querySelector("h2")?.textContent || el.dataset.section || "").trim(),
    };
  });
  return r;
}

function annotHit(x, y, rects) {
  for (const [id, r] of Object.entries(rects)) {
    if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return id;
  }
  return null;
}

function annotNearestAnchor(y, rects) {
  let best = null, bd = 1e9;
  for (const [id, r] of Object.entries(rects)) {
    const dTop = Math.abs(y - r.y), dBot = Math.abs(y - (r.y + r.h));
    if (dTop < bd) { bd = dTop; best = { anchor: `før ${r.label || id}`, ref: id, pos: "before" }; }
    if (dBot < bd) { bd = dBot; best = { anchor: `etter ${r.label || id}`, ref: id, pos: "after" }; }
  }
  return best;
}

function annotResolve(m, rects) {
  const { kind, x1, y1, x2, y2 } = m;
  const from = annotHit(x1, y1, rects);
  const fl = from ? (rects[from]?.label || from) : "";
  if (kind === "arrow") {
    const to = annotHit(x2, y2, rects);
    if (from && to && from !== to) {
      const tl = rects[to]?.label || to;
      return { action: "move", targets: [from], ref: to, pos: "after",
        chip: `Flytt «${fl.slice(0, 28)}» → etter «${tl.slice(0, 22)}»`, tokens: 0 };
    }
    const a = annotNearestAnchor(y2, rects);
    return from && a
      ? { action: "move", targets: [from], ...a, chip: `Flytt «${fl.slice(0, 28)}» → ${a.anchor}`, tokens: 0 }
      : { action: "unclear", chip: "Uklart mål — tegn til en seksjon", tokens: 0 };
  }
  if (kind === "del") {
    return from
      ? { action: "delete", targets: [from], chip: `Slett «${fl.slice(0, 32)}»`, tokens: 0 }
      : { action: "unclear", chip: "Ingen seksjon truffet", tokens: 0 };
  }
  if (kind === "box") {
    const inside = Object.entries(rects).filter(([, r]) => {
      const ox = Math.max(0, Math.min(x2, r.x + r.w) - Math.max(x1, r.x));
      const oy = Math.max(0, Math.min(y2, r.y + r.h) - Math.max(y1, r.y));
      return (ox * oy) / Math.max(1, r.w * r.h) > 0.3;
    }).map(([id]) => id);
    if (inside.length) {
      return { action: "group", targets: inside, chip: `Merket ${inside.length} seksjon(er) — skriv notat`, tokens: 0 };
    }
    const a = annotNearestAnchor((y1 + y2) / 2, rects);
    return { action: "insert", ...a, chip: `Sett inn her (${a?.anchor || "?"})`, tokens: 0 };
  }
  if (kind === "pen") {
    return from
      ? { action: "mark", targets: [from], chip: `Merket «${fl.slice(0, 32)}» — skriv notat`, tokens: 0 }
      : { action: "unclear", chip: "Ingen seksjon truffet", tokens: 0 };
  }
  if (kind === "note") {
    return { action: "note", targets: from ? [from] : [],
      chip: from ? `Notat på «${fl.slice(0, 28)}»` : "Fritt notat", tokens: 0.004 };
  }
  return { action: "unclear", chip: "—", tokens: 0 };
}

function bindAnnotEvents(host) {
  if (!host) return;
  // loadDraft replaces #draft-annot-host — must rebind to the live element
  if (ANNOT.boundHost === host) return;
  if (ANNOT.boundHost) {
    try { ANNOT.boundHost.removeEventListener("mousedown", onAnnotDown); } catch (_) {}
  }
  ANNOT.boundHost = host;
  ANNOT.bound = true;
  host.addEventListener("mousedown", onAnnotDown);
  if (!ANNOT.windowBound) {
    window.addEventListener("mousemove", onAnnotMove);
    window.addEventListener("mouseup", onAnnotUp);
    ANNOT.windowBound = true;
  }
}

function onAnnotDown(e) {
  if (!ANNOT.on || ANNOT.tool === "sel") return;
  if (e.target.closest("button, a, input, textarea, .sec-toolbar, .mangler-btn")) return;
  e.preventDefault();
  const p = annotHostPoint(e);
  ANNOT.drawing = { kind: ANNOT.tool, x1: p.x, y1: p.y, x2: p.x, y2: p.y };
  redrawAnnotOverlay();
}

function onAnnotMove(e) {
  if (!ANNOT.drawing) return;
  const p = annotHostPoint(e);
  ANNOT.drawing.x2 = p.x;
  ANNOT.drawing.y2 = p.y;
  // WORKORDER 0.58 §C3 — edge auto-scroll while drawing
  const canvas = document.querySelector(".editor-canvas");
  if (canvas) {
    const cr = canvas.getBoundingClientRect();
    const edge = 28;
    if (e.clientY < cr.top + edge) canvas.scrollTop -= 8;
    else if (e.clientY > cr.bottom - edge) canvas.scrollTop += 8;
  }
  redrawAnnotOverlay();
}

function onAnnotUp() {
  if (!ANNOT.drawing) return;
  const d = ANNOT.drawing;
  const dist = Math.hypot(d.x2 - d.x1, d.y2 - d.y1);
  if (dist < 6 && d.kind !== "del" && d.kind !== "pen" && d.kind !== "note") {
    ANNOT.drawing = null;
    redrawAnnotOverlay();
    return;
  }
  const rects = annotMeasureSections();
  const cmd = annotResolve(d, rects);
  ANNOT.marks.push({ ...d, id: "m" + Date.now(), cmd, note: "" });
  ANNOT.drawing = null;
  redrawAnnotOverlay();
  refreshAnnotToolsChrome();
}

function refreshAnnotToolsChrome() {
  renderAnnotMarksList();
  updateAnnotChatBadge();
  if (EDITOR_RAIL !== "tools") return;
  const n = ANNOT.marks.length;
  const cost = ANNOT.marks.reduce((s, m) => s + (m.cmd?.tokens || 0), 0);
  const btn = $("#annot-exec-btn");
  const clear = document.querySelector(".tools-rail .btn.ghost");
  if (btn) {
    btn.disabled = !n;
    btn.textContent = `Utfør (${n}) ${cost > 0 ? "· €" + cost.toFixed(3) : "· gratis"}`;
  }
  if (clear) clear.disabled = !n;
}

function pendingAnnotPayload() {
  return (ANNOT.marks || []).map(m => ({
    id: m.id,
    kind: m.kind,
    action: m.cmd?.action || null,
    chip: m.cmd?.chip || "",
    targets: m.cmd?.targets || [],
    ref: m.cmd?.ref || null,
    pos: m.cmd?.pos || null,
    note: m.note || "",
    tokens: m.cmd?.tokens || 0,
  }));
}

function updateAnnotChatBadge() {
  const n = (ANNOT.marks || []).length;
  const badge = $("#annot-chat-badge");
  const compose = $("#assist-compose");
  const input = $("#assist-input");
  const send = $("#assist-send-btn");

      ? "Skriv notat til merket… Enter utfører (ikke ny samtale)"
      : "Skriv her… Enter sender · Shift+Enter ny linje";
  }
  if (send) send.textContent = n > 0 ? "Utfør merke →" : "Send →";
}

function redrawAnnotOverlay() {
  const host = $("#draft-annot-host");
  const svg = $("#annot-svg");
  if (!host || !svg) return;
  // Full document height — marks stay glued while scrolling
  const h = Math.max(host.scrollHeight, host.offsetHeight, 1);
  const w = Math.max(host.scrollWidth, host.offsetWidth, 1);
  svg.setAttribute("width", String(w));
  svg.setAttribute("height", String(h));
  svg.style.width = w + "px";
  svg.style.height = h + "px";
  const rects = annotMeasureSections();
  const all = [...ANNOT.marks, ...(ANNOT.drawing ? [{ ...ANNOT.drawing, id: "tmp", cmd: annotResolve(ANNOT.drawing, rects) }] : [])];
  svg.innerHTML = all.map(m => {
    const c = m.cmd || {};
    const col = c.action === "delete" ? "#C74E19" : c.action === "unclear" ? "#999" : "#1450B4";
    if (m.kind === "arrow") {
      const mx = (m.x1 + m.x2) / 2;
      return `<g>
        <path d="M${m.x1},${m.y1} C${mx},${m.y1} ${mx},${m.y2} ${m.x2},${m.y2}" fill="none" stroke="${col}" stroke-width="2.4" stroke-dasharray="7,4"/>
        <circle cx="${m.x2}" cy="${m.y2}" r="5" fill="${col}"/>
      </g>`;
    }
    if (m.kind === "box" || m.kind === "note") {
      const x = Math.min(m.x1, m.x2), y = Math.min(m.y1, m.y2);
      return `<rect x="${x}" y="${y}" width="${Math.abs(m.x2 - m.x1)}" height="${Math.abs(m.y2 - m.y1)}" rx="5"
        fill="${col}22" stroke="${col}" stroke-width="2.2" stroke-dasharray="6,4"/>`;
    }
    if (m.kind === "del") {
      return `<g stroke="#C74E19" stroke-width="3">
        <line x1="${m.x1 - 11}" y1="${m.y1 - 11}" x2="${m.x1 + 11}" y2="${m.y1 + 11}"/>
        <line x1="${m.x1 + 11}" y1="${m.y1 - 11}" x2="${m.x1 - 11}" y2="${m.y1 + 11}"/></g>`;
    }
    return `<line x1="${m.x1}" y1="${m.y1}" x2="${m.x2}" y2="${m.y2}" stroke="#F5C400" stroke-width="4" stroke-linecap="round"/>`;
  }).join("");

  host.querySelectorAll(".annot-chip").forEach(el => el.remove());
  ANNOT.marks.forEach(m => {
    const chip = document.createElement("div");
    chip.className = "annot-chip";
    chip.style.left = Math.min(m.x1, m.x2) + "px";
    chip.style.top = Math.max(0, Math.min(m.y1, m.y2) - 19) + "px";
    chip.textContent = (m.cmd?.chip || "") + (m.cmd?.tokens ? ` · €${m.cmd.tokens.toFixed(3)}` : " · gratis");
    host.appendChild(chip);
  });
}

function renderAnnotMarksList() {
  const el = $("#annot-marks-list");
  if (!el) return;
  if (!ANNOT.marks.length) { el.innerHTML = ""; return; }
  el.innerHTML = ANNOT.marks.map((m, i) => `
    <div class="annot-mark-card">
      <b>${i + 1}. ${esc(m.cmd?.chip || m.kind)}</b>
      <input value="${esc(m.note || "")}" placeholder="Notat (valgfritt)…"
        oninput="ANNOT.marks[${i}].note=this.value" />
    </div>`).join("");
}

async function executeAnnotMarks(opts) {
  opts = opts || {};
  if (!ANNOT.marks.length) return;
  const host = $("#draft-annot-host");
  const done = [];
  const modelMarks = [];
  for (const m of ANNOT.marks) {
    const c = m.cmd || {};
    if (c.action === "move" && c.targets?.[0] && c.ref) {
      const from = host?.querySelector(`.sec-wrap[data-section="${CSS.escape(c.targets[0])}"]`);
      const to = host?.querySelector(`.sec-wrap[data-section="${CSS.escape(c.ref)}"]`);
      if (from && to && from !== to) {
        if (c.pos === "before") to.parentNode.insertBefore(from, to);
        else to.parentNode.insertBefore(from, to.nextSibling);
        done.push(c.chip);
      }
    } else if (c.action === "delete" && c.targets?.[0]) {
      const ok = opts.fromChat || confirm(`${c.chip}\n\nSlettes kun i visningen nå. Fortsette?`);
      if (ok) {
        host?.querySelector(`.sec-wrap[data-section="${CSS.escape(c.targets[0])}"]`)?.remove();
        done.push(c.chip);
      }
    } else if (c.action === "insert") {
      // WORKORDER 0.59 D3 — unify with sketch insert (no separate system)
      const geo = m.geo || m.box || {};
      await addSketchPlaceholder({
        type: SKETCH_TOOL || "text",
        x: geo.x || m.x || 45,
        y: geo.y || m.y || 80,
        w: geo.w || m.w || 200,
        h: geo.h || m.h || 80,
        label: m.note || "",
      });
      done.push(c.chip || "Sett inn");
      modelMarks.push(m);
    } else if (c.action === "note" || c.action === "mark" || c.action === "group") {
      done.push(c.chip);
      modelMarks.push(m);
    } else {
      done.push(c.chip || "Uklart");
    }
  }

  const payload = pendingAnnotPayload();
  ANNOT.marks = [];
  redrawAnnotOverlay();
  refreshAnnotToolsChrome();

  if (modelMarks.length && PROJECT?.id) {
    const note = opts.note || modelMarks.map(m => m.note).filter(Boolean).join(" · ") || "";
    const labels = modelMarks.map(m => m.cmd?.chip || m.kind).join("; ");
    try {
      const r = await api("/api/doc/chat", { method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
          id: PROJECT.id,
          template: ACTIVE_DOC,
          message: note || `Utfør tegnelag: ${labels}`,
          section: modelMarks[0]?.cmd?.targets?.[0] || CHAT_SCOPE.section || null,
          annotations: payload,
          annot_execute: true,
        }) });
      if (r.conversation) PROJECT.conversation = r.conversation;
      assistBubble("bot", formatConvHtml(r.reply || `Merket: ${labels}`));
    } catch (e) {
      assistBubble("bot", esc(e.message));
    }
  } else if (done.length) {
    assistBubble("bot", "✓ " + done.slice(0, 3).join(" · ") + (done.length > 3 ? "…" : "") + " <span class=\"mono\" style=\"font-size:10px;color:var(--steel)\">(gratis)</span>");
  }
  updateAnnotChatBadge();
}

function isVisualFile(f) {
  return f.kind === "photo" || /\.(pdf|svg|png|jpe?g|webp)$/i.test(f.name || "");
}

function renderDocSources(namesInDoc) {
  const body = $("#sources-body") || $("#rail-body");
  const meta = $("#sources-meta") || $("#rail-meta");
  if (!body) return;
  if (EDITOR_RAIL && EDITOR_RAIL !== "analyze") return;
  const files = PROJECT?.files || [];
  const inDoc = new Set(namesInDoc || []);
    const excludedSrc = new Set((PROJECT?.excluded_sources || []).map(e => e.file));
  const excludedFig = new Set((PROJECT?.excluded_figures || []).map(e => e.file));
  const indexed = files.filter(f => f.indexed).length;
  if (meta) {
    meta.textContent = `${files.length} filer · ${indexed} indeksert` +
      (inDoc.size ? ` · ${inDoc.size} i dokumentet` : "") +
      (excludedSrc.size ? ` · ${excludedSrc.size} av` : "");
  }
  // Files used in the open document first, then the rest; toggled-off last
  const sorted = [...files].sort((a, b) => {
    const aOff = excludedSrc.has(a.name) || a.enabled === false;
    const bOff = excludedSrc.has(b.name) || b.enabled === false;
    const ax = aOff ? 2 : inDoc.has(a.name) ? 0 : 1;
    const bx = bOff ? 2 : inDoc.has(b.name) ? 0 : 1;
    if (ax !== bx) return ax - bx;
    return a.name.localeCompare(b.name);
  });
  const supersedeMap = PROJECT?.supersede_map || {};
  const rows = sorted.length ? sorted.map(f => {
    const used = inDoc.has(f.name);
    const off = excludedSrc.has(f.name) || f.enabled === false;
    const figOff = excludedFig.has(f.name);
    const sup = supersedeMap[f.name];
    const nameEsc = esc(f.name).replace(/'/g, "\\'");
    const supHint = sup ? `<div class="supersede-hint">⚠ ${esc(sup.label || sup.reason)}
      <button type="button" class="btn ghost" onclick="event.stopPropagation();applySupersedeFromRow('${esc(PROJECT.id)}','${esc(sup.name).replace(/'/g, "\\'")}','${nameEsc}')">Ekskluder fra dokumentet</button>
      <button type="button" class="btn ghost" onclick="event.stopPropagation();dismissSupersede('${esc(PROJECT.id)}','${esc(sup.name).replace(/'/g, "\\'")}')">Behold</button>
    </div>` : "";
    const figBtn = (f.indexed && isVisualFile(f) && !off)
      ? `<button type="button" class="src-figbtn ${figOff ? "off" : ""}" title="${figOff ? "Vis illustrasjon i dokumentet" : "Skjul illustrasjon (raden i tabeller beholdes)"}"
           onclick="event.stopPropagation();toggleSourceFigure('${nameEsc}', ${figOff})">🖼</button>`
      : "";
    return `<div class="src-file ${off ? "src-off" : ""}" data-srcfile="${esc(f.name)}" style="cursor:pointer"
      onclick="openSourceFile('${nameEsc}')" title="Åpne ${esc(f.name)}">
      <span class="kindtag">${f.kind === "photo" ? "IMG" : f.kind === "doc" ? "DOC" : "—"}</span>
      <span style="min-width:0;flex:1">
        <b style="font-size:11px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name.split("/").pop())}</b>
        <div style="color:var(--steel);font-size:10.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.caption || (f.indexed ? "klikk for å åpne" : "venter"))}</div>
        ${off ? '<span class="chip wait" style="margin-top:4px;display:inline-block">⏸ av i dette dokumentet</span>'
              : used ? '<span class="chip ok" style="margin-top:4px;display:inline-block">i dokumentet</span>' : ""}
        ${supHint}
      </span>
      ${figBtn}
      ${f.indexed ? `<button type="button" class="src-toggle ${off ? "" : "on"}" role="switch" aria-checked="${!off}"
        title="${off ? "Ta med i dokumentet igjen" : "Slå av for dette dokumentet (filen forblir indeksert)"}"
        onclick="event.stopPropagation();toggleSource('${nameEsc}', ${off})"><span class="knob"></span></button>` : ""}
    </div>`;
  }).join("") : `<div class="mono" style="font-size:11px;color:var(--steel)">Ingen filer.</div>`;
  body.innerHTML = rows;
}

function formatConvHtml(text) {
  return esc(text || "").replace(/\n/g, "<br>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}

/* ── LEARNING_AND_BOUNDARIES §1 — chat attachments ───────────────── */
function chatBubbleFor(surface, who, html) {
  if (surface === "hub") return hubBubble(who, html);
  if (surface === "artifact") return aBubble(who, html);
  return assistBubble(who, html);
}

function chatPendingGap() {
  const pend = PROJECT?.chat_pending;
  if (pend?.action === "resolve_mangler" && pend.key) return pend.key;
  if (CHAT_SCOPE?.section && PROJECT?.gaps?.length) {
    const g = PROJECT.gaps.find(x => x.section === CHAT_SCOPE.section);
    if (g?.key) return g.key;
  }
  // Prefer serial_no / reg_no if open (nameplate flow)
  for (const k of ["serial_no", "reg_no", "manufacturer"]) {
    if ((PROJECT?.gaps || []).some(g => g.key === k)) return k;
  }
  return null;
}

function chatPickFile(surface) {
  const id = surface === "hub" ? "hub-attach-file"
    : surface === "artifact" ? "artifact-attach-file" : "editor-attach-file";
  $(`#${id}`)?.click();
}

function chatDragOver(ev) {
  ev.preventDefault();
  ev.currentTarget.classList.add("chat-drop-over");
}
function chatDragLeave(ev) {
  ev.currentTarget.classList.remove("chat-drop-over");
}
async function chatDrop(ev, surface) {
  ev.preventDefault();
  ev.currentTarget.classList.remove("chat-drop-over");
  const f = ev.dataTransfer?.files?.[0];
  if (f) await chatAttachFile(f, surface);
}
async function chatFilePicked(ev, surface) {
  const f = ev.target?.files?.[0];
  ev.target.value = "";
  if (f) await chatAttachFile(f, surface);
}
async function chatPaste(ev, surface) {
  const items = ev.clipboardData?.items;
  if (!items) return;
  for (const it of items) {
    if (it.type?.startsWith("image/")) {
      ev.preventDefault();
      const f = it.getAsFile();
      if (f) await chatAttachFile(f, surface);
      return;
    }
  }
}

function fileToB64(file) {
  return new Promise((ok, err) => {
    const r = new FileReader();
    r.onload = () => ok(String(r.result).split(",")[1] || "");
    r.onerror = err;
    r.readAsDataURL(file);
  });
}

async function chatAttachFile(file, surface, opts) {
  if (!file) return;
  const b64 = await fileToB64(file);
  chatBubbleFor(surface, "user", `📎 ${esc(file.name)}`);
  chatBubbleFor(surface, "bot", "Ser på filen…");
  try {
    const body = {
      name: file.name,
      content_b64: b64,
      surface,
      id: PROJECT?.id,
      template: ACTIVE_DOC,
      pending_gap: opts?.pending_gap || chatPendingGap(),
      choice: opts?.choice,
      token: opts?.token,
    };
    const r = await api("/api/chat/attach", { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(body) });
    const logRm = () => {
      const log = surface === "hub" ? $("#hub-log")
        : surface === "artifact" ? $("#a-assist-log") : $("#assist-log");
      if (log?.lastChild) log.lastChild.remove();
    };
    logRm();
    await chatHandleAttachResult(r, surface, file);
  } catch (e) {
    const log = surface === "hub" ? $("#hub-log")
      : surface === "artifact" ? $("#a-assist-log") : $("#assist-log");
    if (log?.lastChild) log.lastChild.remove();
    chatBubbleFor(surface, "bot", esc(e.message));
  }
}

async function chatHandleAttachResult(r, surface, file) {
  // WORKORDER_0.25 A2/E1 — cold-start index ack + create-project CTA
  if (r.kind === "hub_indexed") {
    const actions = r.actions?.length
      ? r.actions
      : [{ id: "create_project", label: "Opprett prosjekt →", token: r.token }];
    chatBubbleFor(surface, "bot", formatConvHtml(r.reply || "") + hubRenderActions(actions));
    if (r.pending_action) HUB_PENDING = { token: r.token, pending: r.pending_action };
    return;
  }
  if (r.kind === "ambiguous") {
    chatBubbleFor(surface, "bot", `${esc(r.reply)}
      <div class="actions">
        <button type="button" onclick="chatAttachChoice('form','${esc(r.token)}','${surface}')">${esc(r.buttons?.[0]?.label || "Skjema")}</button>
        <button type="button" onclick="chatAttachChoice('project','${esc(r.token)}','${surface}')">${esc(r.buttons?.[1]?.label || "Prosjektfil")}</button>
      </div>`);
    return;
  }
  if (r.kind === "form_propose") {
    const acts = (r.buttons || r.actions || []).map(b => {
      const id = b.id || "";
      if (id === "as_project" || id === "project")
        return `<button type="button" onclick="chatAttachChoice('project','${esc(r.token)}','${surface}')">${esc(b.label || "Prosjektfil")}</button>`;
      if (id === "extract_form_values")
        return `<button type="button" class="btn ghost" onclick="chatImportTemplate('${esc(r.token)}','${surface}')">${esc(b.label)}</button>`;
      return `<button type="button" class="btn" onclick="chatImportTemplate('${esc(r.token)}','${surface}')">${esc(b.label || "Lag mal")}</button>`;
    }).join("");
    chatBubbleFor(surface, "bot", `${esc(r.reply)}<div class="actions">${acts}</div>`);
    return;
  }
  if (r.kind === "need_project") {
    chatBubbleFor(surface, "bot", esc(r.reply));
    return;
  }
  if (r.kind === "project_material") {
    let html = formatConvHtml(r.reply || "");
    if (r.covers?.length) {
      html += `<div class="actions"><button type="button" class="btn" onclick="chatApplyCovers(${JSON.stringify(r.covers)})">Bruk ${r.covers.length} treff</button></div>`;
    }
    if (r.targeted?.offer) {
      html += `<div class="actions"><button type="button" class="btn" onclick="chatTargetedExtract('${esc(r.targeted.key)}','${esc(r.targeted.file)}')">Hent ${esc(r.targeted.key)} fra bildet</button></div>`;
    }
    chatBubbleFor(surface, "bot", html);
    if (r.conversation) PROJECT.conversation = r.conversation;
    if (PROJECT?.id && surface !== "hub") {
      try { await renderProject(PROJECT.id); } catch (_) {}
    }
    return;
  }
  chatBubbleFor(surface, "bot", formatConvHtml(r.reply || JSON.stringify(r.kind)));
}

async function chatAttachChoice(choice, token, surface) {
  if (choice === "form") {
    // Re-route as form_template → one offer (not skip to import)
    chatBubbleFor(surface, "bot", "Ser på skjemaet…");
    try {
      const r = await api("/api/chat/attach", { method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
          id: PROJECT?.id, template: ACTIVE_DOC, surface, choice: "form", token,
          pending_gap: chatPendingGap(),
        }) });
      const log = surface === "hub" ? $("#hub-log")
        : surface === "artifact" ? $("#a-assist-log") : $("#assist-log");
      if (log?.lastChild) log.lastChild.remove();
      await chatHandleAttachResult(r, surface, null);
    } catch (e) {
      chatBubbleFor(surface, "bot", esc(e.message));
    }
    return;
  }
  chatBubbleFor(surface, "bot", "Legger inn som prosjektfil…");
  try {
    const r = await api("/api/chat/attach", { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        id: PROJECT?.id, template: ACTIVE_DOC, surface, choice: "project", token,
        pending_gap: chatPendingGap(),
      }) });
    const log = surface === "hub" ? $("#hub-log")
      : surface === "artifact" ? $("#a-assist-log") : $("#assist-log");
    if (log?.lastChild) log.lastChild.remove();
    await chatHandleAttachResult(r, surface, null);
  } catch (e) {
    chatBubbleFor(surface, "bot", esc(e.message));
  }
}

async function chatImportTemplate(token, surface) {
  const t0 = Date.now();
  const hostId = "import-prog-" + (token || "x");
  chatBubbleFor(surface, "bot", `<span id="${hostId}">Bygger malutkast…</span>`);
  const tick = setInterval(() => {
    const el = document.getElementById(hostId);
    if (!el) return;
    const s = Math.round((Date.now() - t0) / 1000);
    if (s >= 3) el.textContent = `Bygger malutkast… ${s}s (extract_form_structure)`;
  }, 400);
  try {
    const r = await api("/api/chat/attach/import-template", { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ token }) });
    clearInterval(tick);
    const log = surface === "hub" ? $("#hub-log")
      : surface === "artifact" ? $("#a-assist-log") : $("#assist-log");
    if (log?.lastChild) log.lastChild.remove();
    // WORKORDER_0.30 review screen — field rows with type pills
    const review = r.review?.sections || [];
    let rows = "";
    if (review.length) {
      rows = review.map(s => {
        const fields = (s.fields || []).map(f =>
          `<div class="field-row"><b>${esc(f.label_no || f.key)}</b>
            <span class="type-pill">${esc(f.type || "text")}</span>
            ${f.unit ? `<span class="type-pill">${esc(f.unit)}</span>` : ""}
            <span class="type-pill">${f.required ? "Påkrevd" : "Valgfritt"}</span>
          </div>`).join("");
        return `<div style="margin-top:8px"><div class="label">${esc(s.title || s.section_key)}</div>${fields || "—"}</div>`;
      }).join("");
    } else {
      rows = (r.pills || []).map(p =>
        `<span title="${esc((p.facts||[]).join(', '))}"><b>${esc(p.title)}</b></span>`).join("");
      rows = `<div class="pill-row">${rows || "—"}</div>`;
    }
    const cost = r.cost_eur != null ? ` · €${Number(r.cost_eur).toFixed(3)}` : "";
    chatBubbleFor(surface, "bot", `${formatConvHtml(r.reply)}
      <div class="attach-review">
        <div class="label">FELT — bekreft${cost}</div>
        ${rows}
        <div class="actions">
          <button type="button" class="btn" onclick="chatConfirmTemplate('${esc(r.token)}','${surface}')">Godta mal</button>
        </div>
      </div>`);
  } catch (e) {
    clearInterval(tick);
    chatBubbleFor(surface, "bot", esc(e.message));
  }
}

    for (const t of conv) {

    if (a.id === "confirm_connection_all")
      return `<button type="button" class="btn" onclick="chatHint('${esc(a.label || "Confirm all")}')">${esc(a.label || "Confirm all")}</button>`;
    if (a.id === "confirm_generate")
      return `<button type="button" class="btn" onclick="chatHint('ja')">${esc(a.label || "Ja — kjør")}</button>`;
    if (a.id === "accept_draft")
      return `<button type="button" class="btn" onclick="chatHint('Bruk denne')">${esc(a.label || "Bruk denne")}</button>`;
    if (a.id === "save_as_template")
      return `<button type="button" class="btn" onclick="chatHint('Lagre som mal')">${esc(a.label || "Lagre som mal")}</button>`;
    if ((a.id === "import_form" || a.id === "review_fields") && token)
      return `<button type="button" class="btn" onclick="chatImportTemplate('${esc(token)}','editor')">${esc(a.label || "Lag mal")}</button>`;
    if ((a.id === "as_project" || a.id === "project") && token)
      return `<button type="button" class="btn ghost" onclick="chatAttachChoice('project','${esc(token)}','editor')">${esc(a.label || "Prosjektfil")}</button>`;
    return "";
  }).join("")}</div>`;
}

async function chatHint(text) {
  const input = $("#assist-input");
  if (input) {
    input.value = text;
    resizeAssistInput();
  }
  await chatSend();
}

function assistInputKey(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    chatSend();
  }
}

function resizeAssistInput() {
  const el = $("#assist-input");
  if (!el) return;
  el.style.height = "0px";
  el.style.height = Math.min(120, el.scrollHeight) + "px";
}

function toolsOpenDiagramStudio() {
  if (!PROJECT?.id) {
    showToast(L("Velg et prosjekt først", "Select a project first"));
    return;
  }
  const q = new URLSearchParams({ project: PROJECT.id });
  if (ACTIVE_DOC) q.set("template", ACTIVE_DOC);
  window.open("/diagram.html?" + q.toString(), "_blank", "noopener");
}

function toolsOpenBoxesDemo() {
  window.open("/boxes-demo.html", "_blank", "noopener");
}

function toolsOpenElectricalDemo() {
  toolsOpenDiagramStudio();
}

function toolsOpenCalculations() {
  setEditorRail("tools");
  const panel = document.getElementById("tools-engine-panel");
  if (panel) {
    panel.innerHTML = "<p class=\"annot-hint\">Beregninger legges inn i dokumentseksjoner eller via assistenten.</p>";
  }
}

function toolsOpenMaterials() {
  setEditorRail("tools");
  const panel = document.getElementById("tools-engine-panel");
  if (panel) {
    panel.innerHTML = "<p class=\"annot-hint\">Materialer bindes via Tools når du redigerer designseksjoner.</p>";
  }
}

boot();
</script>
