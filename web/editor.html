<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Foldok — Editor v3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; background: #F2F0EA; font-family: Archivo, sans-serif; }
    .backbar { background: #16181D; padding: 8px 20px; }
    .backbar a { color: #F5C400; text-decoration: none; font-size: 13px; font-weight: 700; }
    #root { height: calc(100vh - 33px); }
    #fallback { padding: 48px; font-family: "IBM Plex Mono", monospace; color: #5A6472; }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>
<body>
  <div class="backbar"><a href="index.html">← Foldok hub</a></div>
  <div id="root"></div>
  <script src="../ui-editor-v3.compiled.js"></script>
  <script>
    if (window.React && window.ReactDOM && window.FoldokEditorV3) {
      ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(window.FoldokEditorV3));
    } else {
      document.getElementById("root").innerHTML =
        '<div id="fallback">Editor failed to load.' +
        (window.React ? '' : ' React CDN blocked — check internet.') +
        (window.FoldokEditorV3 ? '' : ' ui-editor-v3.compiled.js missing.') + '</div>';
    }
  </script>
</body>
</html>
